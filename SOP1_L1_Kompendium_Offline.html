<script>
const DATA={"entries":[{"name":"opendir","group":"Katalogi","signature":"DIR *opendir(const char *name);","header":"<dirent.h>","params":"name: ścieżka katalogu (względna od CWD lub absolutna).","ret":"DIR * przy sukcesie, NULL i errno przy błędzie.","errs":"EACCES, ENOENT, ENOTDIR, EMFILE, ENFILE, ELOOP","notes":"Otwiera strumień wpisów katalogu; nie myl z FILE*. Pamiętaj o closedir().","example":"DIR *d = opendir(path);\nif (!d) { perror(\"opendir\"); return -1; }","man":"man 3p fdopendir / man 3 opendir","keywords":"skan katalogu enumerate","priority":1},{"name":"readdir","group":"Katalogi","signature":"struct dirent *readdir(DIR *dirp);","header":"<dirent.h>","params":"dirp: aktywny strumień katalogu otrzymany z opendir().","ret":"Wskaźnik struct dirent; NULL na końcu LUB przy błędzie. Przy końcu errno nie jest zmieniane.","errs":"EBADF, EOVERFLOW","notes":"Przed KAŻDYM wywołaniem, którego NULL bada się jako EOF, ustaw errno=0. d_name to sama nazwa bez ścieżki. Wskaźnik może zostać nadpisany następnym readdir, nie free(). Kolejność wpisów dowolna. d_type to dodatek Linuksa i może być DT_UNKNOWN.","example":"for (;;) {\n    errno = 0;\n    struct dirent *e = readdir(d);\n    if (!e) {\n        if (errno) perror(\"readdir\");\n        break;\n    }\n    if (!strcmp(e->d_name, \".\") || !strcmp(e->d_name, \"..\")) continue;\n    puts(e->d_name);\n}","man":"man 3p readdir / man 0p dirent.h","keywords":"errno d_name d_type EOF","priority":1},{"name":"closedir","group":"Katalogi","signature":"int closedir(DIR *dirp);","header":"<dirent.h>","params":"dirp: otwarty strumień DIR*.","ret":"0 przy sukcesie, -1 i errno przy błędzie.","errs":"EBADF, EINTR (zależnie od implementacji)","notes":"Zwalnia zasoby otwartego katalogu. Nie używaj dirp po zamknięciu.","example":"if (closedir(d) == -1) perror(\"closedir\");","man":"man 3p closedir","keywords":"zwalnianie","priority":1},{"name":"rewinddir","group":"Katalogi","signature":"void rewinddir(DIR *dirp);","header":"<dirent.h>","params":"dirp: otwarty strumień katalogu.","ret":"Brak wartości zwracanej.","errs":"Nie raportuje errno w klasycznym interfejsie.","notes":"Resetuje pozycję do początku strumienia. Zawartość katalogu mogła się zmienić.","example":"rewinddir(d);","man":"man 3p rewinddir","keywords":"restart skanowania","priority":2},{"name":"telldir / seekdir","group":"Katalogi","signature":"long telldir(DIR *dirp);\nvoid seekdir(DIR *dirp, long loc);","header":"<dirent.h>","params":"dirp: strumień; loc: nieprzezroczysta pozycja z telldir.","ret":"telldir: pozycja, -1 na błędzie; seekdir: void.","errs":"EBADF, EOVERFLOW","notes":"To NIE jest offset bajtowy. Zachowaj lokację wyłącznie jako wartość dla seekdir tego samego strumienia.","example":"long pos = telldir(d);\n/* ... */\nseekdir(d, pos);","man":"man 3p telldir / man 3p seekdir","keywords":"pozycja katalogu","priority":2},{"name":"dirfd","group":"Katalogi","signature":"int dirfd(DIR *dirp);","header":"<dirent.h>","params":"dirp: strumień katalogu.","ret":"Deskryptor int ≥0; -1 na błędzie.","errs":"EINVAL, EBADF","notes":"Zaawansowane: łączy DIR* z deskryptorowym API (*at); nie zamykaj otrzymanego fd samodzielnie, jeśli DIR* ma go posiadać.","example":"int fd = dirfd(d);","man":"man 3p dirfd","keywords":"fstatat openat","priority":2},{"name":"stat","group":"Metadane","signature":"int stat(const char *restrict path, struct stat *restrict buf);","header":"<sys/stat.h>","params":"path: ścieżka; buf: wskaźnik na istniejącą strukturę struct stat do wypełnienia.","ret":"0 / -1 i errno.","errs":"ENOENT, ENOTDIR, EACCES, ELOOP, ENAMETOOLONG, EOVERFLOW","notes":"Podąża za symlinkiem końcowym. Dla uszkodzonego dowiązania często ENOENT. Do wykrywania samego symlinka użyj lstat.","example":"struct stat st;\nif (stat(path, &st) == -1) perror(\"stat\");\nelse printf(\"%jd\\n\", (intmax_t)st.st_size);","man":"man 3p fstatat / man 2 stat","keywords":"rozmiar inode prawa symlink follow","priority":1},{"name":"lstat","group":"Metadane","signature":"int lstat(const char *restrict path, struct stat *restrict buf);","header":"<sys/stat.h>","params":"path: ścieżka, buf: zaalokowana struct stat.","ret":"0 / -1 i errno.","errs":"ENOENT, ENOTDIR, EACCES, ELOOP, ENAMETOOLONG","notes":"Nie podąża za OSTATNIM symlinkiem; pośrednie elementy ścieżki nadal są rozwiązywane. st_size symlinka = długość zapisanego celu w bajtach (Linux); nie rozmiar pliku docelowego.","example":"struct stat st;\nif (lstat(path, &st) == -1) perror(\"lstat\");\nelse if (S_ISLNK(st.st_mode)) puts(\"link symboliczny\");","man":"man 3p fstatat / man 2 lstat","keywords":"uszkodzony dangling link rozpoznanie","priority":1},{"name":"fstat / fstatat","group":"Metadane","signature":"int fstat(int fd, struct stat *buf);\nint fstatat(int dirfd, const char *path, struct stat *buf, int flags);","header":"<sys/stat.h>","params":"fd: deskryptor; dirfd: katalog bazowy; flags: 0 lub AT_SYMLINK_NOFOLLOW.","ret":"0 / -1, errno.","errs":"EBADF, ENOENT, EACCES, EINVAL","notes":"fstatat względnie do deskryptora katalogu eliminuje potrzebę zmiany CWD; AT_SYMLINK_NOFOLLOW odpowiada lstat dla końcowego elementu. Przy ścieżce absolutnej dirfd ignorowany.","example":"fstatat(dirfd(d), e->d_name, &st, AT_SYMLINK_NOFOLLOW);","man":"man 3p fstatat / man 2 stat","keywords":"*at AT_FDCWD","priority":3},{"name":"S_ISREG / S_ISDIR / S_ISLNK","group":"Metadane","signature":"S_ISREG(st.st_mode); S_ISDIR(st.st_mode); S_ISLNK(st.st_mode);","header":"<sys/stat.h>","params":"st_mode: pole struct stat, nie wskaźnik na całą strukturę.","ret":"Wynik logiczny niezerowy lub zero.","errs":"Nie ustawia errno.","notes":"Inne: S_ISCHR, S_ISBLK, S_ISFIFO, S_ISSOCK. Makra sprawdzają TYP, a uprawnienia wydobywa się maską st_mode & 07777.","example":"if (S_ISREG(st.st_mode)) puts(\"plik\");\nelse if (S_ISDIR(st.st_mode)) puts(\"katalog\");\nelse if (S_ISLNK(st.st_mode)) puts(\"symlink\");","man":"man 0p sys_stat.h / man 7 inode","keywords":"tryb st_mode rodzaj","priority":1},{"name":"getcwd","group":"Katalogi","signature":"char *getcwd(char *buf, size_t size);","header":"<unistd.h>","params":"buf: bufor użytkownika; size: jego pojemność w bajtach, wraz z miejscem na NUL.","ret":"buf / NULL i errno.","errs":"ERANGE, EACCES, ENOENT, ENOMEM","notes":"POSIX wymaga przekazania własnego bufora; getcwd(NULL,0) jest rozszerzeniem GNU, nie uniwersalnym POSIX. Ścieżka może być dłuższa od PATH_MAX.","example":"char cwd[4096];\nif (!getcwd(cwd, sizeof cwd)) perror(\"getcwd\");","man":"man 3p getcwd","keywords":"current working directory katalog bieżący","priority":1},{"name":"chdir / fchdir","group":"Katalogi","signature":"int chdir(const char *path);\nint fchdir(int fd);","header":"<unistd.h>","params":"path: nowy katalog CWD; fd: deskryptor katalogu.","ret":"0 / -1 i errno.","errs":"EACCES, ENOENT, ENOTDIR, ELOOP, EBADF","notes":"Zmienia CWD całego procesu. Kolejne ścieżki względne inaczej się interpretują. Zwykle łatwiej dołączać ścieżki i NIE zmieniać CWD.","example":"if (chdir(\"library\") == -1) perror(\"chdir\");","man":"man 3p chdir / man 3p fchdir","keywords":"powrót ścieżki względne","priority":2},{"name":"pathconf / fpathconf","group":"Metadane","signature":"long pathconf(const char *path, int name);\nlong fpathconf(int fd, int name);","header":"<unistd.h>","params":"name: np. _PC_NAME_MAX, _PC_PATH_MAX, _PC_LINK_MAX.","ret":"Wartość; -1 gdy błąd LUB limit nieokreślony.","errs":"EINVAL, EACCES, ENOENT","notes":"Ustaw errno=0; przy -1 sprawdź errno: 0 może oznaczać brak limitu. NAME_MAX nie zawsze globalną stałą.","example":"errno = 0;\nlong n = pathconf(\".\", _PC_NAME_MAX);\nif (n == -1 && errno) perror(\"pathconf\");","man":"man 3p pathconf","keywords":"PATH_MAX NAME_MAX długość","priority":2},{"name":"symlink","group":"Dowiązania","signature":"int symlink(const char *target, const char *linkpath);","header":"<unistd.h>","params":"target: dosłowny tekst celu zapisany w dowiązaniu; linkpath: nazwa NOWEGO linku.","ret":"0 / -1 i errno.","errs":"EEXIST, ENOENT (katalog nadrzędny), EACCES, ENOSPC, EROFS, ENAMETOOLONG","notes":"Cel NIE musi istnieć. Względny target liczony jest z KATALOGU ZAWIERAJĄCEGO linkpath, a nie z CWD programu. Symlink nie może powstać na istniejącej nazwie.","example":"if (symlink(\"../../library/book.txt\", \"index/by-title/book\") == -1)\n    perror(\"symlink\");","man":"man 3p symlink / man 2 symlink","keywords":"target linkpath linkname dangling link EEXIST","priority":1},{"name":"readlink","group":"Dowiązania","signature":"ssize_t readlink(const char *restrict path, char *restrict buf, size_t bufsiz);","header":"<unistd.h>","params":"path: symlink; buf: bufor; bufsiz: pojemność.","ret":"Liczba zapisanych BAJTÓW, bez NUL; -1 przy błędzie.","errs":"EINVAL (nie symlink), ENOENT, EACCES, ENAMETOOLONG","notes":"KRYTYCZNE: readlink nie dopisuje \\0. Jeśli wynik == bufsiz, może być obcięty. Daj miejsce +1 albo powiększaj bufor.","example":"char buf[4096];\nssize_t n = readlink(path, buf, sizeof buf - 1);\nif (n == -1) perror(\"readlink\");\nelse { buf[n] = '\\0'; puts(buf); }","man":"man 3p readlink / man 2 readlink","keywords":"null terminator NUL ucięcie","priority":1},{"name":"link / linkat","group":"Dowiązania","signature":"int link(const char *oldpath, const char *newpath);\nint linkat(int olddirfd, const char *oldpath, int newdirfd, const char *newpath, int flags);","header":"<unistd.h>","params":"oldpath: istniejąca nazwa źródłowa; newpath: nowa nazwa tego SAMEGO inode.","ret":"0 / -1 i errno.","errs":"EEXIST, EXDEV, EPERM, EMLINK, ENOENT","notes":"Twardy link współdzieli inode, treść, uprawnienia i rozmiar; nie jest kopią. Zwykle nie można tworzyć hardlinków do katalogów; nie działa między różnymi systemami plików. Zachowanie wobec symlinków zależy od wariantu/flag.","example":"if (link(\"a.txt\", \"drugie_imie.txt\") == -1) perror(\"link\");","man":"man 3p link / man 3p linkat","keywords":"hardlink inode nlink","priority":2},{"name":"unlink / unlinkat","group":"Pliki i strumienie","signature":"int unlink(const char *path);\nint unlinkat(int dirfd, const char *path, int flags);","header":"<unistd.h>","params":"path: nazwa wpisu do usunięcia; w unlinkat AT_REMOVEDIR usuwa katalog.","ret":"0 / -1 i errno.","errs":"ENOENT, EACCES, EPERM, EISDIR, EROFS, EBUSY","notes":"Usuwa nazwę, niekoniecznie od razu inode. Usuwanie symlinka NIE usuwa jego celu. Zawartość otwartego pliku może istnieć do zamknięcia ostatniego fd.","example":"if (unlink(path) == -1 && errno != ENOENT) perror(\"unlink\");","man":"man 3p unlink / man 3p unlinkat","keywords":"kasuj plik istniejący link","priority":1},{"name":"mkdir","group":"Katalogi","signature":"int mkdir(const char *path, mode_t mode);","header":"<sys/stat.h>","params":"path: nazwa nowego katalogu; mode: uprawnienia (np. 0755), ograniczane przez umask.","ret":"0 / -1 i errno.","errs":"EEXIST, ENOENT, EACCES, ENOSPC, EROFS","notes":"Nie tworzy automatycznie brakujących rodziców (brak -p). Dla katalogu x = prawo przechodzenia.","example":"if (mkdir(\"index\", 0755) == -1) perror(\"mkdir\");","man":"man 3p mkdir","keywords":"prawa katalog","priority":1},{"name":"rmdir","group":"Katalogi","signature":"int rmdir(const char *path);","header":"<unistd.h>","params":"path: istniejący PUSTY katalog.","ret":"0 / -1 i errno.","errs":"ENOTEMPTY, EEXIST, ENOENT, ENOTDIR, EBUSY, EACCES","notes":"Usuwa wyłącznie pusty katalog. Nie zadziała dla zwykłego pliku i zwykle nie dla symlinków.","example":"if (rmdir(\"tmp\") == -1) perror(\"rmdir\");","man":"man 3p rmdir","keywords":"usuń katalog pusty","priority":2},{"name":"rename / renameat","group":"Pliki i strumienie","signature":"int rename(const char *old, const char *new);\nint renameat(int oldfd, const char *old, int newfd, const char *new);","header":"<stdio.h> (rename), <stdio.h> (renameat POSIX)","params":"old: poprzednia nazwa; new: nowa nazwa/ścieżka.","ret":"0 / -1 i errno.","errs":"EXDEV, EACCES, ENOENT, EISDIR, ENOTDIR, ENOTEMPTY","notes":"Atomowe zastąpienie nazwy w obrębie tego samego FS (nie gwarantuje trwałości po awarii). Gdy new istnieje, może zostać zastąpiony. Nadaje się do wymiany tymczasowego pliku requirements.","example":"if (rename(\"requirements.tmp\", \"requirements\") == -1) perror(\"rename\");","man":"man 3p rename","keywords":"atomic replace plik tmp","priority":2},{"name":"chmod / fchmod","group":"Uprawnienia","signature":"int chmod(const char *path, mode_t mode);\nint fchmod(int fd, mode_t mode);","header":"<sys/stat.h>","params":"mode: np. 0644, 0444, 0755; fchmod: otwarty deskryptor.","ret":"0 / -1 i errno.","errs":"EPERM, EACCES, ENOENT, EROFS","notes":"Zasadniczo właściciel pliku lub uprzywilejowany proces może zmienić uprawnienia; NIE wystarczy samo W_OK. chmod z nazwą podąża za symlinkiem. umask NIE ogranicza chmod.","example":"if (chmod(path, 0444) == -1) perror(\"chmod\");","man":"man 3p chmod / man 3p fchmod","keywords":"właściciel owner r w x mode","priority":1},{"name":"umask","group":"Uprawnienia","signature":"mode_t umask(mode_t cmask);","header":"<sys/stat.h>","params":"cmask: bity USUWANE z bazowych uprawnień przy tworzeniu, np. 0022.","ret":"Zwraca poprzednią maskę; nie ma sygnalizowanego błędu.","errs":"Brak standardowego błędu.","notes":"Nowy plik przez fopen ma bazę 0666, katalog mkdir bierze argument mode. Wynik = requested & ~umask (w zakresie normalnych bitów praw). Nie da się dodać x do pliku przez umask. Zmiana dotyczy procesu.","example":"mode_t old = umask(0);\nFILE *f = fopen(\"x\", \"w\");\numask(old);","man":"man 3p umask / man 2 umask","keywords":"octal nowe pliki maska","priority":1},{"name":"access / faccessat","group":"Uprawnienia","signature":"int access(const char *path, int amode);\nint faccessat(int fd, const char *path, int amode, int flag);","header":"<unistd.h>","params":"amode: F_OK, R_OK, W_OK, X_OK, albo OR flag R_OK|W_OK.","ret":"0 gdy test przechodzi; -1 i errno gdy nie.","errs":"EACCES, ENOENT, ENOTDIR","notes":"Sprawdza dostęp według realnych identyfikatorów (szczegóły patrz manual). Uwaga na TOCTOU: dostęp może zmienić się pomiędzy access a właściwym fopen. Próba operacji jest wiarygodniejsza.","example":"if (access(path, F_OK) == 0) puts(\"istnieje\");","man":"man 3p access","keywords":"check existence real uid TOCTOU","priority":2},{"name":"chown / lchown","group":"Uprawnienia","signature":"int chown(const char *path, uid_t owner, gid_t group);\nint lchown(const char *path, uid_t owner, gid_t group);","header":"<unistd.h>","params":"owner,group: ID, -1 = nie zmieniaj danej wartości; lchown dotyczy linku.","ret":"0 / -1 i errno.","errs":"EPERM, EACCES, ENOENT","notes":"Zmiana właściciela zależy od uprawnień i systemu; nie zawsze wymaga roota dla wszystkich rodzajów zmian. chown podąża za symlinkiem; lchown nie.","example":"if (chown(path, uid, gid) == -1) perror(\"chown\");","man":"man 3p chown","keywords":"uid gid owner","priority":2},{"name":"realpath","group":"Dowiązania","signature":"char *realpath(const char *restrict path, char *restrict resolved_path);","header":"<stdlib.h>","params":"path: ścieżka do rozwiązania; resolved_path: w POSIX bufor; na wielu systemach NULL powoduje alokację.","ret":"Wskaźnik na wynik albo NULL/errno.","errs":"ENOENT, ELOOP, EACCES, ENAMETOOLONG","notes":"Rozwiązuje symlinki i . / .. oraz zwraca ścieżkę kanoniczną. realpath(path,NULL) jest dostępne w POSIX.1-2008, wynik free(). Wymaga istnienia odpowiednich elementów ścieżki.","example":"char *p = realpath(\"library/book\", NULL);\nif (p) { puts(p); free(p); }","man":"man 3p realpath","keywords":"absolutna canonical resolve symlink","priority":2},{"name":"fopen / freopen","group":"Pliki i strumienie","signature":"FILE *fopen(const char *restrict path, const char *restrict mode);\nFILE *freopen(const char *restrict path, const char *restrict mode, FILE *restrict stream);","header":"<stdio.h>","params":"path: ścieżka; mode: r,rb,w,w+,a,a+,r+; stream: istniejący strumień do przekierowania.","ret":"FILE* / NULL i errno.","errs":"ENOENT, EACCES, EISDIR, EMFILE, ENOSPC","notes":"w TRUNCATE; a zawsze dopisuje na końcu przy każdym zapisie; r wymaga istnienia. Przy pliku istniejącym w nie zmienia jego uprawnień. Dla czytania+pisania trzeba wykonać fflush lub operację pozycjonowania między fazami (z wyjątkami opisanymi w manualu).","example":"FILE *f = fopen(\"data.bin\", \"rb\");\nif (!f) perror(\"fopen\");","man":"man 3p fopen / man 3p freopen","keywords":"r w a plus binary FILE","priority":1},{"name":"fclose","group":"Pliki i strumienie","signature":"int fclose(FILE *stream);","header":"<stdio.h>","params":"stream: otwarty FILE*.","ret":"0 / EOF i errno.","errs":"EIO, ENOSPC, EBADF","notes":"Może wykryć błąd opóźnionego zapisu. Nigdy nie używaj zamkniętego FILE*. Zamykanie nie oznacza fizycznej trwałości danych po utracie zasilania.","example":"if (fclose(f) == EOF) perror(\"fclose\");","man":"man 3p fclose","keywords":"flush close","priority":1},{"name":"fread","group":"Pliki i strumienie","signature":"size_t fread(void *restrict ptr, size_t size, size_t nmemb, FILE *restrict stream);","header":"<stdio.h>","params":"ptr: bufor; size: bajty w elemencie; nmemb: liczba elementów; stream: FILE*.","ret":"Liczba CAŁYCH odczytanych elementów, ≤nmemb.","errs":"Błąd/EOF przez ferror/feof, nie przez samą wartość zwrotną.","notes":"Do surowego odczytu bajtów użyj size=1; wtedy zwraca liczbę bajtów. Niepełny ostatni element przy size>1 nie jest liczony jako cały.","example":"unsigned char buf[4096];\nsize_t n = fread(buf, 1, sizeof buf, f);\nif (ferror(f)) perror(\"fread\");","man":"man 3p fread","keywords":"binary eof ferror","priority":1},{"name":"fwrite","group":"Pliki i strumienie","signature":"size_t fwrite(const void *restrict ptr, size_t size, size_t nmemb, FILE *restrict stream);","header":"<stdio.h>","params":"ptr: dane; size: bajty/element; nmemb: liczba elementów; stream: FILE*.","ret":"Liczba zapisanych elementów; <nmemb = błąd zapisu.","errs":"ENOSPC, EIO, EDQUOT","notes":"Do bajtów użyj size=1; sprawdzaj wyniki. fwrite nie dopisuje NUL i nie interpretuje formatowania.","example":"if (fwrite(buf, 1, n, f) != n) perror(\"fwrite\");","man":"man 3p fwrite","keywords":"write buffer binary","priority":1},{"name":"fseek / fseeko","group":"Pliki i strumienie","signature":"int fseek(FILE *stream, long offset, int whence);\nint fseeko(FILE *stream, off_t offset, int whence);","header":"<stdio.h>","params":"offset: przesunięcie bajtów w binarnym strumieniu; whence: SEEK_SET, SEEK_CUR, SEEK_END.","ret":"0 / niezero przy błędzie.","errs":"EINVAL, ESPIPE, EOVERFLOW","notes":"SEEK_END+0 ustawia tuż za końcem. fseeko+ftello używają off_t, wygodne dla dużych plików. Nie można seekować pipe/terminala. fseek za EOF nie powiększa pliku aż do zapisu.","example":"if (fseeko(f, 0, SEEK_END) != 0) perror(\"fseeko\");","man":"man 3p fseek / man 3p fseeko","keywords":"offset reposition sparse","priority":1},{"name":"ftell / ftello","group":"Pliki i strumienie","signature":"long ftell(FILE *stream);\noff_t ftello(FILE *stream);","header":"<stdio.h>","params":"stream: otwarty strumień.","ret":"Aktualna pozycja; -1L / (off_t)-1 przy błędzie.","errs":"ESPIPE, EOVERFLOW, EBADF","notes":"Na plikach binarnych POSIX zwykle offset w bajtach; ftello jest lepsze dla dużych plików. st_size z stat często prostsze do sprawdzania rozmiaru.","example":"if (fseeko(f, 0, SEEK_END) == 0) {\n    off_t n = ftello(f);\n    if (n == (off_t)-1) perror(\"ftello\");\n}","man":"man 3p ftell / man 3p ftello","keywords":"rozmiar pliku seek","priority":2},{"name":"rewind / fgetpos / fsetpos","group":"Pliki i strumienie","signature":"void rewind(FILE *stream);\nint fgetpos(FILE *stream, fpos_t *pos);\nint fsetpos(FILE *stream, const fpos_t *pos);","header":"<stdio.h>","params":"pos: miejsce na nieprzezroczysty zapis pozycji.","ret":"rewind: void; pozostałe 0 / niezero.","errs":"ESPIPE, EINVAL","notes":"rewind czyści również wskaźnik błędu, ale nie zgłasza własnego błędu. fpos_t nie należy traktować jak zwykłego offsetu.","example":"fpos_t p;\nif (fgetpos(f, &p)) perror(\"fgetpos\");","man":"man 3p rewind / man 3p fgetpos","keywords":"position restore","priority":2},{"name":"fgetc / getc / getchar","group":"Pliki i strumienie","signature":"int fgetc(FILE *stream);\nint getc(FILE *stream);\nint getchar(void);","header":"<stdio.h>","params":"stream: FILE*; getchar odczytuje stdin.","ret":"Bajt konwertowany do unsigned char jako int albo EOF (-1).","errs":"Odróżnij EOF od błędu ferror(stream).","notes":"Zapisuj wynik do int, nie char; znak 0xFF nie może mylić się z EOF.","example":"int c;\nwhile ((c = fgetc(f)) != EOF) putchar(c);\nif (ferror(f)) perror(\"fgetc\");","man":"man 3p fgetc","keywords":"single char stdin","priority":1},{"name":"fputc / putc / putchar","group":"Pliki i strumienie","signature":"int fputc(int c, FILE *stream);\nint putc(int c, FILE *stream);\nint putchar(int c);","header":"<stdio.h>","params":"c: kod znaku, konwertowany do unsigned char; stream: FILE*.","ret":"Zapisany znak / EOF przy błędzie.","errs":"EIO, ENOSPC","notes":"Znak '\\0' zapisuje bajt 0, inny niż ASCII '0' (48).","example":"if (fputc('\\0', f) == EOF) perror(\"fputc\");","man":"man 3p fputc","keywords":"zero byte","priority":2},{"name":"fgets / fputs","group":"Pliki i strumienie","signature":"char *fgets(char *restrict s, int n, FILE *restrict stream);\nint fputs(const char *restrict s, FILE *restrict stream);","header":"<stdio.h>","params":"fgets n: rozmiar bufora (z NUL); fputs s: tekst zakończony NUL.","ret":"fgets: s / NULL; fputs: wynik ≥0 / EOF.","errs":"EOF lub błąd do ustalenia feof/ferror","notes":"fgets zachowuje \\n jeżeli zmieści się w buforze; dla bardzo długich linii wygodniejsze getline. fputs nie wypisuje końcowego NUL.","example":"char s[256];\nwhile (fgets(s, sizeof s, f)) fputs(s, stdout);","man":"man 3p fgets / man 3p fputs","keywords":"line","priority":2},{"name":"getline / getdelim","group":"Parsowanie","signature":"ssize_t getline(char **restrict lineptr, size_t *restrict n, FILE *restrict stream);\nssize_t getdelim(char **restrict lineptr, size_t *restrict n, int delim, FILE *restrict stream);","header":"<stdio.h>","params":"lineptr: adres wskaźnika bufora; n: adres pojemności; stream: FILE*. Przy wejściu *lineptr=NULL,*n=0.","ret":"Długość w bajtach z delimiterem (jeśli był); -1 dla EOF lub błędu.","errs":"ENOMEM, EINVAL, EIO","notes":"Alokuje/reallokuje; po zakończeniu free(line), także przy częściowych błędach. Zawsze dopisuje NUL, ale wynik długości może obejmować \\n. Przy -1 rozróżnij ferror od feof. Wymaga POSIX.1-2008.","example":"char *line = NULL; size_t cap = 0;\nssize_t len;\nwhile ((len = getline(&line, &cap, f)) != -1) {\n    if (len && line[len - 1] == '\\n') line[--len] = '\\0';\n    puts(line);\n}\nif (ferror(f)) perror(\"getline\");\nfree(line);","man":"man 3p getline / man 3 getline","keywords":"metadata key:value parse line","priority":1},{"name":"fprintf / printf / snprintf","group":"Parsowanie","signature":"int fprintf(FILE *restrict f, const char *restrict format, ...);\nint snprintf(char *restrict s, size_t n, const char *restrict fmt, ...);","header":"<stdio.h>","params":"f: strumień; format: zawsze własny stały format, nie dane wejściowe. snprintf n: pojemność wliczając NUL.","ret":"Liczba znaków bez NUL; ujemna przy błędzie. snprintf może zwrócić ≥n (ucięcie).","errs":"EOVERFLOW, EILSEQ, EIO","notes":"NIGDY printf(user_string). Poprawnie printf(\"%s\", user_string). Format %jd z (intmax_t)st.st_size; %zu dla size_t; %zd dla ssize_t.","example":"fprintf(stderr, \"problem: %s\\n\", path);\nprintf(\"%jd\\n\", (intmax_t)st.st_size);","man":"man 3p fprintf / man 3p snprintf","keywords":"format string %s %zu %jd format security","priority":1},{"name":"fscanf / sscanf","group":"Parsowanie","signature":"int fscanf(FILE *restrict stream, const char *restrict fmt, ...);\nint sscanf(const char *restrict s, const char *restrict fmt, ...);","header":"<stdio.h>","params":"fmt: format; argumenty: adresy zmiennych.","ret":"Liczba dopasowanych/przypisanych pól lub EOF.","errs":"EILSEQ, EINVAL","notes":"Sprawdzaj liczbę konwersji; dla %s ZAWSZE limit szerokości: np. %63s. Do złożonych formatów zwykle lepsze getline + ręczne parsowanie.","example":"int x;\nif (sscanf(\"123\", \"%d\", &x) != 1) puts(\"zły format\");","man":"man 3p fscanf","keywords":"parse integer scan","priority":2},{"name":"feof / ferror / clearerr","group":"Pliki i strumienie","signature":"int feof(FILE *stream); int ferror(FILE *stream); void clearerr(FILE *stream);","header":"<stdio.h>","params":"stream: FILE*.","ret":"feof/ferror: niezerowe gdy flaga ustawiona.","errs":"Nie ustawiają errno.","notes":"feof NIE przewiduje końca pliku. Sprawdzasz dopiero po nieudanym odczycie. clearerr resetuje flagi EOF i błędu.","example":"size_t n = fread(b, 1, sizeof b, f);\nif (n == 0 && ferror(f)) perror(\"read\");\nif (n == 0 && feof(f)) puts(\"koniec\");","man":"man 3p feof / man 3p ferror","keywords":"EOF flags","priority":2},{"name":"fflush / setvbuf","group":"Pliki i strumienie","signature":"int fflush(FILE *stream);\nint setvbuf(FILE *restrict stream, char *restrict buf, int mode, size_t size);","header":"<stdio.h>","params":"stream: wyjściowy/aktualizacyjny FILE*; mode: _IONBF, _IOLBF, _IOFBF.","ret":"fflush: 0 / EOF; setvbuf: 0 / niezero.","errs":"EIO, ENOSPC, EBADF","notes":"fflush przenosi dane z bufora stdio do systemu, nie gwarantuje zapisu fizycznego na dysku (fsync robi coś innego). stderr typowo niebuforowany; stdout do terminala liniowy, do pliku zwykle pełny. setvbuf przed innym IO.","example":"printf(\"Etap 1...\");\nif (fflush(stdout) == EOF) perror(\"fflush\");","man":"man 3p fflush / man 3p setvbuf","keywords":"stdout stderr buffering pipe","priority":1},{"name":"fileno / fdopen","group":"Pliki i strumienie","signature":"int fileno(FILE *stream);\nFILE *fdopen(int fd, const char *mode);","header":"<stdio.h>","params":"fileno: strumień; fdopen: istniejący deskryptor, tryb zgodny z fd.","ret":"fileno: fd / -1; fdopen: FILE* / NULL.","errs":"EBADF, EINVAL, EMFILE","notes":"fileno jest przydatne np. do readv lub fstat. fdopen przejmuje odpowiedzialność za zamknięcie fd przez fclose. Nie mieszaj operacji FILE* i fd bez synchronizacji offsetów/buforów.","example":"int fd = fileno(f);\nif (fd == -1) perror(\"fileno\");","man":"man 3p fileno / man 3p fdopen","keywords":"bridge stdio fd readv","priority":2},{"name":"ftruncate / truncate","group":"Pliki i strumienie","signature":"int ftruncate(int fd, off_t length);\nint truncate(const char *path, off_t length);","header":"<unistd.h>","params":"length: docelowy rozmiar ≥0 w bajtach; fd: otwarty do zapisu.","ret":"0 / -1 i errno.","errs":"EINVAL, EFBIG, EACCES, EBADF, EROFS","notes":"Wydłużenie regularnego pliku tworzy logiczne zera, potencjalnie rzadką dziurę. Truncate po ścieżce jest POSIX; dla strumienia FILE* użyj fflush przed ftruncate(fileno(f),...).","example":"if (ftruncate(fileno(f), size) == -1) perror(\"ftruncate\");","man":"man 3p ftruncate / man 3p truncate","keywords":"fixed size zeros sparse truncate","priority":1},{"name":"open / close / read / write","group":"Deskryptory (dodatek)","signature":"int open(const char *path, int flags, ... /* mode_t */);\nint close(int fd);\nssize_t read(int fd, void *buf, size_t count);\nssize_t write(int fd, const void *buf, size_t count);","header":"<fcntl.h> (open), <unistd.h> (reszta)","params":"open flags: O_RDONLY/O_WRONLY/O_RDWR, O_CREAT, O_TRUNC, O_EXCL; mode przy O_CREAT.","ret":"open: fd/-1; close:0/-1; read: bajty,0 EOF,-1 błąd; write: bajty/-1.","errs":"EINTR, EBADF, EACCES, ENOSPC, EAGAIN","notes":"To główny temat L2, ale readv w zad.4 wymaga fd. O_CREAT|O_EXCL zapobiega przypadkowemu nadpisaniu. O_NOFOLLOW (Linux) zabezpiecza przed podążaniem za końcowym symlinkiem.","example":"int fd = open(path, O_RDONLY);\nif (fd == -1) perror(\"open\");\nelse if (close(fd) == -1) perror(\"close\");","man":"man 3p open / man 3p read / man 3p write","keywords":"L2 descriptor create O_CREAT","priority":2},{"name":"readv / writev","group":"Deskryptory (dodatek)","signature":"ssize_t readv(int fd, const struct iovec *iov, int iovcnt);\nssize_t writev(int fd, const struct iovec *iov, int iovcnt);","header":"<sys/uio.h>","params":"fd: deskryptor; iov: tablica {void *iov_base; size_t iov_len;}; iovcnt: liczba segmentów (1..IOV_MAX).","ret":"Liczba faktycznie przesłanych BAJTÓW; 0 EOF; -1 i errno.","errs":"EINTR, EBADF, EINVAL, EFAULT, EIO","notes":"Zadanie 4: pobierz 4 bajty wielkości i 64 bajty tytułu bez kopiowania buforów. KRÓTKI odczyt może być poprawny; trzeba obsłużyć kontynuację i niepełny ostatni rekord.","example":"struct iovec v[2] = {\n    {.iov_base = &size,  .iov_len = 4},\n    {.iov_base = title, .iov_len = 64}\n};\nssize_t n = readv(fd, v, 2); /* sprawdź n, nie zakładaj 68 */","man":"man 3p readv / man 2 readv","keywords":"scatter gather binary 68 book database","priority":1},{"name":"getopt","group":"Argumenty CLI","signature":"int getopt(int argc, char *const argv[], const char *optstring);","header":"<unistd.h>","params":"argc/argv: argumenty main; optstring: np. \"p:o:d:e:\". Dwukropek oznacza argument WYMAGANY.","ret":"Znak opcji jako int; -1 po końcu; ? dla błędnej opcji.","errs":"Nie opiera się na errno; kontroluj optarg, optind, optopt.","notes":"Wywołuj w while. optarg to wartość bieżącej opcji, optind wskazuje pierwszy nieprzetworzony argument po analizie. Opis GNU może permutować argumenty, POSIX może nie. opterr=0 wyłącza automatyczne komunikaty.","example":"int c; opterr = 0;\nwhile ((c = getopt(argc, argv, \"p:o:\")) != -1) {\n    switch (c) {\n    case 'p': puts(optarg); break;\n    case 'o': puts(optarg); break;\n    default: fprintf(stderr, \"usage...\\n\"); return 1;\n    }\n}\nif (optind != argc) return 1;","man":"man 3p getopt","keywords":"-p -o optarg optind duplicate flags","priority":1},{"name":"getenv / setenv / unsetenv","group":"Argumenty CLI","signature":"char *getenv(const char *name);\nint setenv(const char *name, const char *value, int overwrite);\nint unsetenv(const char *name);","header":"<stdlib.h>","params":"name: nazwa zmiennej; overwrite: 0 nie nadpisuje, !=0 nadpisuje.","ret":"getenv: wskaźnik do wartości lub NULL; pozostałe 0/-1.","errs":"ENOMEM, EINVAL (setenv).","notes":"getenv(\"L1_OUTPUTFILE\") przy -o z zad.2. NULL oznacza brak, pusty string może być osobnym przypadkiem. Nie free() wyniku getenv.","example":"const char *out = getenv(\"L1_OUTPUTFILE\");\nif (out && *out) { /* nazwa pliku */ }","man":"man 3p getenv / man 3p setenv","keywords":"environment L1_OUTPUTFILE","priority":1},{"name":"strtol / strtoul / strtoll","group":"Parsowanie","signature":"long strtol(const char *restrict nptr, char **restrict endptr, int base);\nunsigned long strtoul(...);\nlong long strtoll(...);","header":"<stdlib.h>","params":"nptr: napis; endptr: gdzie zakończono odczyt; base: 8 (ósemkowy), 10 lub 0 (autodetekcja).","ret":"Liczba; przy przepełnieniu LONG_MAX/MIN i errno ERANGE; przy braku cyfr endptr==nptr.","errs":"ERANGE, EINVAL (niektóre implementacje).","notes":"Wyzeruj errno, sprawdź end==start, *end==\\0, ERANGE i własny zakres. Uprawnienia 755 parsuj z base=8, nie 10. Wartości ujemne nie powinny być akceptowane jako rozmiar.","example":"errno = 0; char *end;\nlong n = strtol(optarg, &end, 8);\nif (errno == ERANGE || end == optarg || *end || n < 0 || n > 07777) {\n    fprintf(stderr, \"bad octal mode\\n\"); return 1;\n}","man":"man 3p strtol","keywords":"parse octal 0755 digits validation","priority":1},{"name":"strchr / strrchr","group":"Parsowanie","signature":"char *strchr(const char *s, int c);\nchar *strrchr(const char *s, int c);","header":"<string.h>","params":"s: NUL-zakończony łańcuch; c: szukany bajt/znak.","ret":"Wskaźnik do znalezionego znaku; NULL jeśli brak.","errs":"Brak normalnego errno.","notes":"strchr(line,':') to idealny podział klucz:wartość. strrchr(name,'.') pomaga rozszerzenia. Nie używaj na nie-NUL-owanych polach binarnych bez zabezpieczenia.","example":"char *sep = strchr(line, ':');\nif (sep) { *sep = '\\0'; printf(\"%s => %s\", line, sep + 1); }","man":"man 3p strchr","keywords":"separator colon key:value metadata","priority":1},{"name":"strcmp / strncmp","group":"Parsowanie","signature":"int strcmp(const char *s1, const char *s2);\nint strncmp(const char *s1, const char *s2, size_t n);","header":"<string.h>","params":"s1,s2: NUL-zakończone napisy; n: maksymalna liczba bajtów.","ret":"0 gdy równe; <0 / >0 odpowiednio porządek leksykograficzny bajtów.","errs":"Nie ustawiają errno.","notes":"NIE porównuj wskaźników == zamiast treści. strncmp(\"a\",\"abc\",1)==0 nie oznacza pełnej równości.","example":"if (strcmp(key, \"title\") == 0) { /* pole title */ }","man":"man 3p strcmp","keywords":"name equality duplicate","priority":1},{"name":"strdup / strndup","group":"Parsowanie","signature":"char *strdup(const char *s);\nchar *strndup(const char *s, size_t n);","header":"<string.h>","params":"s: tekst; n: maksymalnie n bajtów do skopiowania.","ret":"Nowo zaalokowany napis / NULL i errno.","errs":"ENOMEM","notes":"Zwolnij free(). strndup obcina według BAJTÓW, więc może rozciąć znak UTF-8. Nie jest to metoda na poprawne „64 znaki” gdy limit dotyczy 64 bajtów.","example":"char *copy = strdup(value);\nif (!copy) perror(\"strdup\");\n/* później */ free(copy);","man":"man 3p strdup","keywords":"duplicate value metadata ownership","priority":1},{"name":"strlen / strnlen / strcspn","group":"Parsowanie","signature":"size_t strlen(const char *s);\nsize_t strnlen(const char *s, size_t maxlen);\nsize_t strcspn(const char *s, const char *reject);","header":"<string.h>","params":"s: tekst z NUL, dla strnlen maxlen: limit skanowania; reject: zbiór niedozwolonych bajtów.","ret":"Długość BAJTÓW przed NUL/znakiem z reject.","errs":"Brak normalnego errno.","notes":"strcspn(line,\"\\r\\n\") usuwa CR/LF; strlen na nie-NUL-owanym tytule bazy (64 bajty) jest niebezpieczne.","example":"line[strcspn(line, \"\\r\\n\")] = '\\0';","man":"man 3p strlen / man 3p strcspn","keywords":"trailing newline trim 64 byte","priority":1},{"name":"memcpy / memmove / memcmp / memset","group":"Pamięć","signature":"void *memcpy(void *restrict dst, const void *restrict src, size_t n);\nvoid *memmove(void *dst,const void *src,size_t n);\nint memcmp(const void *a,const void *b,size_t n);\nvoid *memset(void *s,int c,size_t n);","header":"<string.h>","params":"n: liczba bajtów; dst/src: poprawne bufory o co najmniej n bajtach.","ret":"memcpy/memmove/memset: dst; memcmp: porównanie bajtów.","errs":"Brak errno.","notes":"memcpy UB przy nakładaniu się zakresów, memmove bezpieczne. memset(...,0,...) czyści bajty. Przy binary fixed-length fields użyj memcpy nie strcpy.","example":"char title[65] = {0};\nmemcpy(title, raw_title, 64);\ntitle[64] = '\\0';","man":"man 3p memcpy / man 3p memmove","keywords":"binary non null byte","priority":2},{"name":"malloc / calloc / realloc / free","group":"Pamięć","signature":"void *malloc(size_t size);\nvoid *calloc(size_t n,size_t size);\nvoid *realloc(void *ptr,size_t size);\nvoid free(void *ptr);","header":"<stdlib.h>","params":"size: bajty; calloc n × size z zerowaniem; realloc zmiania pojemność.","ret":"Wskaźnik / NULL i errno (z zastrzeżeniem alokacji 0).","errs":"ENOMEM","notes":"Dla realloc zawsze użyj tymczasowego wskaźnika. Każdy strdup/getline/malloc zwalniaj free. Przy obliczaniu ilości bajtów uwaga na przepełnienie size_t.","example":"char *tmp = realloc(buf, bigger);\nif (!tmp) { perror(\"realloc\"); /* buf nadal ważny */ }\nelse buf = tmp;","man":"man 3p malloc / man 3p realloc","keywords":"memory allocation leaks","priority":1},{"name":"snprintf do składania ścieżek","group":"Parsowanie","signature":"int snprintf(char *restrict str, size_t size, const char *restrict format, ...);","header":"<stdio.h>","params":"size: liczba bajtów razem z NUL; %s z normalnie NUL-zakończoną nazwą.","ret":"Liczba bajtów POTRZEBNYCH bez NUL, także gdy bufor zbyt mały; ujemna przy błędzie.","errs":"EOVERFLOW","notes":"Zamiast zakładać PATH_MAX zbuduj dynamiczny bufor o rozmiarze strlen(a)+1+strlen(b)+1. Nie dodawaj separatora, jeśli prefix już go ma, chyba że dopuszczasz // (POSIX szczególne znaczenie podwójnego początkowego //).","example":"size_t len = strlen(dir) + 1 + strlen(name) + 1;\nchar *path = malloc(len);\nif (path) snprintf(path, len, \"%s/%s\", dir, name);","man":"man 3p snprintf","keywords":"join_path concat directory file","priority":1},{"name":"rand / srand","group":"Pozostałe","signature":"int rand(void); void srand(unsigned int seed);","header":"<stdlib.h>","params":"seed: ziarno pseudolosowe.","ret":"rand: 0..RAND_MAX; srand: void.","errs":"Brak errno.","notes":"rand()%n wprowadza bias; RAND_MAX ma zależną od implementacji wartość (Linux glibc zwykle 2^31-1). srand zwykle raz na uruchomienie, srand(time(NULL)). Nie używaj do kryptografii.","example":"srand((unsigned)time(NULL));\nint letter = 'A' + rand() % 26;","man":"man 3p rand","keywords":"alphabet random sparse","priority":1},{"name":"time / sleep","group":"Pozostałe","signature":"time_t time(time_t *tloc);\nunsigned int sleep(unsigned int seconds);","header":"<time.h> (time), <unistd.h> (sleep)","params":"tloc: opcjonalnie NULL; seconds: liczba sekund.","ret":"time: sekundy od epoki (typ time_t); sleep: liczba niedospanych sekund.","errs":"time: EOVERFLOW w nietypowych przypadkach.","notes":"Typowe do ziarnowania rand i demonstracji buforowania; sleep może wrócić wcześniej po sygnale.","example":"srand((unsigned)time(NULL));\nsleep(1);","man":"man 3p time / man 3p sleep","keywords":"random seed time","priority":2},{"name":"perror / strerror / errno","group":"Obsługa błędów","signature":"void perror(const char *s);\nchar *strerror(int errnum);\nextern int errno;","header":"<stdio.h>, <string.h>, <errno.h>","params":"perror s: prefiks; strerror errnum: kod błędu.","ret":"perror void; strerror napis; errno zmienna/makro wątku.","errs":"errno to kody EACCES, ENOENT etc.","notes":"Sprawdzaj wynik funkcji ZANIM użyjesz errno. Sukces nie musi zerować errno. perror wypisuje na stderr. Jeśli wykonujesz kolejne wywołania, które mogą zmienić errno, zachowaj int saved=errno.","example":"if (lstat(path, &st) == -1) {\n    int saved = errno;\n    fprintf(stderr, \"%s: %s\\n\", path, strerror(saved));\n}","man":"man 3 errno / man 3p perror","keywords":"error message","priority":1},{"name":"exit / EXIT_SUCCESS / EXIT_FAILURE","group":"Obsługa błędów","signature":"void exit(int status);","header":"<stdlib.h>","params":"status: 0 / EXIT_SUCCESS sukces; EXIT_FAILURE niepowodzenie.","ret":"Nie wraca.","errs":"Brak errno.","notes":"exit wykonuje procedury zakończenia i flush stdio; _exit pomija stdio (zaawansowane). W main prostsze return EXIT_FAILURE. Na błędy lokalne czasem należy continue, nie kończyć całego programu.","example":"if (argc != 2) {\n    fprintf(stderr, \"usage: %s FILE\\n\", argv[0]);\n    return EXIT_FAILURE;\n}","man":"man 3p exit","keywords":"usage exit status","priority":2},{"name":"basename / dirname","group":"Parsowanie","signature":"char *basename(char *path); char *dirname(char *path);","header":"<libgen.h>","params":"path: modyfikowalny bufor (POSIX); obie mogą modyfikować zawartość.","ret":"Wskaźnik do części ścieżki.","errs":"Brak normalnego errno.","notes":"Nie podawaj literałów/argv, jeśli nie chcesz ryzykować ich modyfikacji. Użyj strdup na kopii. GNU ma dodatkowe warianty o innej semantyce.","example":"char *cp = strdup(path);\nif (cp) { puts(basename(cp)); free(cp); }","man":"man 3p basename / man 3p dirname","keywords":"path file parent","priority":2},{"name":"mkstemp / tmpfile","group":"Pliki i strumienie","signature":"int mkstemp(char *template);\nFILE *tmpfile(void);","header":"<stdlib.h> (mkstemp), <stdio.h> (tmpfile)","params":"template: modyfikowalny wzorzec zakończony XXXXXX.","ret":"mkstemp: fd/-1; tmpfile: FILE*/NULL.","errs":"EEXIST, EACCES, ENOSPC","notes":"mkstemp atomowo tworzy unikalny plik mode 0600; pamiętaj potem rename/chmod i unlink przy porażce. tmpfile tworzy anonimowy plik tymczasowy usuwany przy zamknięciu.","example":"char tmp[] = \"requirements.XXXXXX\";\nint fd = mkstemp(tmp);\nif (fd == -1) perror(\"mkstemp\");","man":"man 3p mkstemp / man 3p tmpfile","keywords":"temp rewrite requirements","priority":2},{"name":"strtok / strtok_r","group":"Parsowanie","signature":"char *strtok(char *restrict str, const char *restrict delim);\nchar *strtok_r(char *restrict str, const char *restrict delim, char **restrict saveptr);","header":"<string.h>","params":"str: tekst do modyfikacji, potem NULL; delim: zbiór separatorów; saveptr: stan strtok_r.","ret":"Kolejny token lub NULL.","errs":"Brak errno.","notes":"Modyfikuje tekst i pomija puste pola. Do metadanych key:value lepsze strchr, bo puste wartości mają znaczenie. strtok nie ma oddzielnego stanu wielu parserów.","example":"char *state = NULL;\nfor (char *p = strtok_r(line, \",\", &state); p; p = strtok_r(NULL, \",\", &state)) puts(p);","man":"man 3p strtok","keywords":"split tokens","priority":2},{"name":"ssize_t / size_t / off_t / mode_t","group":"Typy i struktury","signature":"size_t; ssize_t; off_t; mode_t; ino_t; uid_t; gid_t; time_t;","header":"<sys/types.h>, <stddef.h>, <stdint.h>, <inttypes.h> (zależnie od typu)","params":"size_t bez znaku (długości); ssize_t ze znakiem (-1 błąd); off_t offset; mode_t prawa+typ.","ret":"Typy nie są funkcjami.","errs":"Nie dotyczy.","notes":"size_t użyj %zu, ssize_t %zd, off_t często rzutuj na intmax_t i %jd. Zawsze zadbaj, aby wartości z -1 nie zmieniły się po konwersji na unsigned.","example":"printf(\"bytes = %zu, size = %jd\\n\", n, (intmax_t)st.st_size);","man":"man 0p sys_types.h","keywords":"integer printf format","priority":1},{"name":"struct stat","group":"Typy i struktury","signature":"struct stat { dev_t st_dev; ino_t st_ino; mode_t st_mode; nlink_t st_nlink; uid_t st_uid; gid_t st_gid; off_t st_size; ... };","header":"<sys/stat.h>","params":"st_dev: urządzenie; st_ino: inode; st_mode: typ + prawa; st_nlink: liczba hardlinków; st_size: bajty; st_mtim: modyfikacja; st_blocks: bloki (nie zawsze rozmiar logiczny).","ret":"Wypełnia stat/lstat/fstat.","errs":"Struktura może mieć dodatkowe pola implementacji.","notes":"Porównanie (st_dev,st_ino) pozwala rozpoznać tę samą instancję pliku; st_size dla katalogu nie jest liczbą wpisów. st_size symlink na Linux to długość celu; st_blocks * 512 to przybliżone zajęcie.","example":"printf(\"ino=%ju links=%ju size=%jd\\n\",\n    (uintmax_t)st.st_ino, (uintmax_t)st.st_nlink,\n    (intmax_t)st.st_size);","man":"man 0p sys_stat.h / man 7 inode","keywords":"st_atim st_mtim st_ctim","priority":1},{"name":"struct dirent","group":"Typy i struktury","signature":"struct dirent { ino_t d_ino; char d_name[]; /* plus rozszerzenia */ };","header":"<dirent.h>","params":"d_name: nazwa w danym katalogu, nie pełna ścieżka; d_ino: inode.","ret":"Zwracana przez readdir.","errs":"Ważność wskaźnika tylko do kolejnych operacji strumienia.","notes":"Linux ma d_type, d_off, d_reclen, ale przenośny kod bazuje na POSIX d_name i lstat. Nie sortuje wpisów.","example":"printf(\"nazwa: %s\\n\", e->d_name);","man":"man 0p dirent.h / man 3 readdir","keywords":"d_name d_type DT_UNKNOWN","priority":2},{"name":"struct iovec","group":"Typy i struktury","signature":"struct iovec { void *iov_base; size_t iov_len; };","header":"<sys/uio.h>","params":"iov_base: adres bufora; iov_len: liczba bajtów do transferu.","ret":"Tablica jest argumentem readv/writev.","errs":"Wadliwy wskaźnik EFAULT.","notes":"readv wypełnia pierwszą część zanim przejdzie do następnej; suma bajtów, nie rekordów. Nie traktuj wyniku < żądanie automatycznie jako błędu.","example":"struct iovec iov[2] = {{&size, 4}, {title, 64}};","man":"man 3p readv / man 0p sys_uio.h","keywords":"vector read scatter","priority":1}],"recipes":[{"name":"Pełne rozwiązanie referencyjne zadania 4 (etapy 2–4)","group":"Zadanie 4","summary":"Samodzielny program C11/POSIX: buduje trzy indeksy symlinków z rekursji po library i opcjonalnie weryfikuje bazę 68-bajtowych rekordów. Kompilowany i testowany na przykładowym drzewie. Parser wypisujący author/title/genre z etapu 1 pokazano osobno.","code":"#define _POSIX_C_SOURCE 200809L\n#include <dirent.h>\n#include <errno.h>\n#include <fcntl.h>\n#include <inttypes.h>\n#include <stdint.h>\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <sys/stat.h>\n#include <sys/uio.h>\n#include <unistd.h>\n\nstatic void die(const char *what) { perror(what); exit(EXIT_FAILURE); }\n\nstatic char *join(const char *a, const char *b) {\n    size_t x = strlen(a), y = strlen(b);\n    if (x > SIZE_MAX - y - 2) { errno = ENOMEM; die(\"join overflow\"); }\n    char *p = malloc(x + y + 2);\n    if (!p) die(\"malloc\");\n    int n = snprintf(p, x+y+2, \"%s/%s\", a, b);\n    if (n < 0 || (size_t)n >= x+y+2) die(\"snprintf\");\n    return p;\n}\nstatic void make_dir(const char *path, int allow_existing) {\n    if (mkdir(path, 0755) == 0) return;\n    if (!allow_existing || errno != EEXIST) die(path);\n    struct stat st;\n    if (stat(path, &st) == -1 || !S_ISDIR(st.st_mode)) {\n        fprintf(stderr, \"Not a usable directory: %s\\n\", path);\n        exit(EXIT_FAILURE);\n    }\n}\nstatic void create_link(const char *from_dir, const char *name,\n                        const char *target_prefix, const char *real_path) {\n    if (!*name || strchr(name, '/') || !strcmp(name, \".\") || !strcmp(name, \"..\")) {\n        fprintf(stderr, \"Invalid index entry name: %s\\n\", name);\n        exit(EXIT_FAILURE);\n    }\n    char *linkpath = join(from_dir, name);\n    char *target = join(target_prefix, real_path);\n    if (symlink(target, linkpath) == -1) {\n        fprintf(stderr, \"Cannot index %s as %s: \", real_path, linkpath);\n        perror(\"symlink\");\n        exit(EXIT_FAILURE);\n    }\n    free(target);\n    free(linkpath);\n}\ntypedef struct {\n    char *title;\n    char *genre;\n} Meta;\nstatic void free_meta(Meta *m) { free(m->title); free(m->genre); }\nstatic Meta parse_meta(const char *path) {\n    Meta m = {0};\n    FILE *f = fopen(path, \"r\");\n    if (!f) die(path);\n    char *line = NULL;\n    size_t cap = 0;\n    ssize_t len;\n    while ((len = getline(&line, &cap, f)) != -1) {\n        while (len > 0 && (line[len-1] == '\\n' || line[len-1] == '\\r'))\n            line[--len] = '\\0';\n        char *sep = strchr(line, ':');\n        if (!sep) continue;\n        *sep = '\\0';\n        char **slot = NULL;\n        if (!strcmp(line, \"title\")) slot = &m.title;\n        if (!strcmp(line, \"genre\")) slot = &m.genre;\n        if (!slot) continue;\n        char *new_value = strndup(sep + 1, 64); // exactly 64 BYTES maximum\n        if (!new_value) die(\"strndup\");\n        free(*slot);\n        *slot = new_value;\n    }\n    if (ferror(f)) die(\"getline\");\n    free(line);\n    if (fclose(f) == EOF) die(\"fclose\");\n    return m;\n}\nstatic void index_book(const char *path, const char *visible_name) {\n    create_link(\"index/by-visible-title\", visible_name, \"../..\", path);\n    Meta m = parse_meta(path);\n    if (m.title && *m.title) {\n        create_link(\"index/by-title\", m.title, \"../..\", path);\n        if (m.genre && *m.genre) {\n            char *genre_dir = join(\"index/by-genre\", m.genre);\n            if (strchr(m.genre, '/') || !strcmp(m.genre, \".\") || !strcmp(m.genre, \"..\")) {\n                fprintf(stderr, \"Invalid genre: %s\\n\", m.genre);\n                exit(EXIT_FAILURE);\n            }\n            make_dir(genre_dir, 1);\n            create_link(genre_dir, m.title, \"../../..\", path);\n            free(genre_dir);\n        }\n    }\n    free_meta(&m);\n}\nstatic void walk_library(const char *path) {\n    DIR *dir = opendir(path);\n    if (!dir) die(path);\n    for (;;) {\n        errno = 0;\n        struct dirent *e = readdir(dir);\n        if (!e) {\n            if (errno) die(\"readdir\");\n            break;\n        }\n        if (!strcmp(e->d_name, \".\") || !strcmp(e->d_name, \"..\")) continue;\n        char *child = join(path, e->d_name);\n        struct stat st;\n        if (lstat(child, &st) == -1) die(child);\n        if (S_ISDIR(st.st_mode)) walk_library(child);\n        else if (S_ISREG(st.st_mode)) index_book(child, e->d_name);\n        free(child);\n    }\n    if (closedir(dir) == -1) die(\"closedir\");\n}\nstatic int read_record(int fd, uint32_t *size, char title[65]) {\n    unsigned char sz[4];\n    size_t done = 0;\n    while (done < 68) {\n        struct iovec v[2]; int cnt = 0;\n        if (done < 4) {\n            v[cnt++] = (struct iovec){.iov_base=sz + done, .iov_len=4 - done};\n            v[cnt++] = (struct iovec){.iov_base=title, .iov_len=64};\n        } else {\n            v[cnt++] = (struct iovec){.iov_base=title + done - 4,\n                                        .iov_len=68 - done};\n        }\n        ssize_t n = readv(fd, v, cnt);\n        if (n < 0) {\n            if (errno == EINTR) continue;\n            return -1;\n        }\n        if (n == 0) {\n            if (done == 0) return 0;  // clean EOF between records\n            errno = EINVAL; return -1; // partial final record\n        }\n        done += (size_t)n;\n    }\n    memcpy(size, sz, 4); // native byte order as required by lab format\n    title[64] = '\\0';\n    return 1;\n}\nstatic void verify_database(const char *db_path) {\n    _Static_assert(sizeof(uint32_t) == 4, \"uint32_t must have 4 bytes\");\n    int fd = open(db_path, O_RDONLY);\n    if (fd == -1) die(db_path);\n    for (;;) {\n        uint32_t size;\n        char title[65] = {0};\n        int result = read_record(fd, &size, title);\n        if (result < 0) die(\"readv/incomplete record\");\n        if (result == 0) break;\n        if (!*title || strchr(title, '/')) {\n            fprintf(stderr, \"Invalid title in database\\n\");\n            exit(EXIT_FAILURE);\n        }\n        char *index_path = join(\"index/by-title\", title);\n        struct stat st;\n        int sret = stat(index_path, &st);\n        if (sret == -1 && errno == ENOENT) {\n            printf(\"Book \\\"%s\\\" is missing\\n\", title);\n        } else if (sret == -1) {\n            die(index_path);\n        } else if (!S_ISREG(st.st_mode) || st.st_size != (off_t)size) {\n            printf(\"Book \\\"%s\\\" size mismatch (%\" PRIu32 \" vs %jd)\\n\",\n                   title, size, (intmax_t)st.st_size);\n        }\n        free(index_path);\n    }\n    if (close(fd) == -1) die(\"close\");\n}\nint main(int argc, char **argv) {\n    if (argc > 2) {\n        fprintf(stderr, \"usage: %s [database]\\n\", argv[0]);\n        return EXIT_FAILURE;\n    }\n    make_dir(\"index\", 0); // EEXIST must be fatal\n    make_dir(\"index/by-visible-title\", 0);\n    make_dir(\"index/by-title\", 0);\n    make_dir(\"index/by-genre\", 0);\n    walk_library(\"library\");\n    if (argc == 2) verify_database(argv[1]);\n    return EXIT_SUCCESS;\n}\n","explain":"<p>Uruchom z katalogu zawierającego <code>library<\/code>: <code>./prog<\/code> albo <code>./prog database_correct<\/code>. <b>Wymagany brak katalogu <code>index<\/code><\/b>, więc przy kolejnym uruchomieniu usuń testowy indeks ręcznie (np. po sprawdzeniu). Kod zawiera zabezpieczenia przed kolizjami i krótkim readv.<\/p>","gotchas":"<p>Przycinanie tytułu do 64 bajtów może rozciąć wielobajtowy znak UTF-8, bo specyfikacja mówi o bajtach. W wersji produkcyjnej można dodać walidację UTF-8, bez zmieniania limitu. Przykład nie implementuje transakcyjnego rollbacku częściowo utworzonego indeksu. Baza przyjmuje natywny format 4-bajtowy rozmiaru, zgodny z lokalnym plikiem zadania.<\/p>","keywords":"alexandria index source all complete"},{"name":"Etap 1 zadania 4: parser metadanych (pełny program)","group":"Zadanie 4","summary":"Odczytaj pary klucz:wartość z pliku; wypisz author, title i genre, a brak oznacz missing!.","code":"#define _POSIX_C_SOURCE 200809L\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <errno.h>\nint main(int argc, char **argv) {\n    if (argc != 2) {\n        fprintf(stderr, \"usage: %s METADATA\\n\", argv[0]);\n        return EXIT_FAILURE;\n    }\n    FILE *f = fopen(argv[1], \"r\");\n    if (!f) { perror(\"fopen\"); return EXIT_FAILURE; }\n    char *author = NULL, *title = NULL, *genre = NULL;\n    char *line = NULL;\n    size_t cap = 0;\n    ssize_t n;\n    while ((n = getline(&line, &cap, f)) != -1) {\n        while (n > 0 && (line[n-1] == '\\n' || line[n-1] == '\\r'))\n            line[--n] = '\\0';\n        char *colon = strchr(line, ':');\n        if (!colon) continue; // linia bez pary - ignorowana\n        *colon++ = '\\0';\n        char **dest = NULL;\n        if (!strcmp(line, \"author\")) dest = &author;\n        else if (!strcmp(line, \"title\")) dest = &title;\n        else if (!strcmp(line, \"genre\")) dest = &genre;\n        if (dest) {\n            char *tmp = strdup(colon);\n            if (!tmp) { perror(\"strdup\"); return EXIT_FAILURE; }\n            free(*dest); *dest = tmp;\n        }\n    }\n    if (ferror(f)) { perror(\"getline\"); return EXIT_FAILURE; }\n    if (fclose(f) == EOF) { perror(\"fclose\"); return EXIT_FAILURE; }\n    printf(\"author: %s\\ntitle: %s\\ngenre: %s\\n\",\n           author ? author : \"missing!\",\n           title  ? title  : \"missing!\",\n           genre  ? genre  : \"missing!\");\n    free(author); free(title); free(genre); free(line);\n    return EXIT_SUCCESS;\n}","explain":"<p><code>strchr<\/code> znajduje pierwszy <code>:<\/code>, <code>strcmp<\/code> dopasowuje całe klucze, <code>strdup<\/code> zapisuje wartość niezależnie od kolejnego <code>getline<\/code>. W kodzie kończącym się wcześnie na fatalnym błędzie można dodatkowo użyć wspólnego cleanup.<\/p>","gotchas":"Błąd <code>uthor<\/code> nie pasuje do <code>author<\/code>, więc wypisujemy missing!.","keywords":"key:value getline author title genre"},{"name":"Bezpieczna rekursja po katalogach","group":"Katalogi","summary":"Rekurencyjne przejście bez podążania za symlinkami, bez zmiany CWD, bez d_type.","code":"#define _POSIX_C_SOURCE 200809L\n#include <dirent.h>\n#include <errno.h>\n#include <inttypes.h>\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <sys/stat.h>\nstatic int walk(const char *path, unsigned depth) {\n    DIR *dir = opendir(path);\n    if (!dir) { perror(path); return -1; }\n    int bad = 0;\n    for (;;) {\n        errno = 0;\n        struct dirent *e = readdir(dir);\n        if (!e) { if (errno) { perror(\"readdir\"); bad = 1; } break; }\n        if (!strcmp(e->d_name,\".\") || !strcmp(e->d_name,\"..\")) continue;\n        size_t cap = strlen(path) + strlen(e->d_name) + 2;\n        char *p = malloc(cap);\n        if (!p) { perror(\"malloc\"); bad = 1; break; }\n        snprintf(p, cap, \"%s/%s\", path, e->d_name);\n        struct stat st;\n        if (lstat(p,&st) == -1) { perror(p); bad=1; }\n        else if (S_ISDIR(st.st_mode)) {\n            if (depth < 64 && walk(p,depth+1) == -1) bad=1;\n        } else if (S_ISREG(st.st_mode)) {\n            printf(\"%s: %jd bytes\\n\", p, (intmax_t)st.st_size);\n        }\n        free(p);\n        if (bad) break;\n    }\n    if (closedir(dir) == -1) { perror(\"closedir\"); bad=1; }\n    return bad ? -1 : 0;\n}\nint main(int argc, char **argv) {\n    return walk(argc>1 ? argv[1] : \".\",1)==0 ? EXIT_SUCCESS : EXIT_FAILURE;\n}","explain":"<p>W zadaniu 2 zamiast limitu głębokości 64 użyj wartości wczytanej z <code>-d<\/code>. <code>depth=1<\/code> oznacza wyłącznie katalog startowy, więc wejdź do potomnych tylko gdy <code>depth &lt; max_depth<\/code>. W zadaniu 4 bez ograniczenia albo według danych testowych.<\/p>","gotchas":"Nie używaj <code>lstat(e->d_name,...)<\/code>, jeśli path nie jest bieżącym katalogiem.","keywords":"walk recursion depth no cycles"},{"name":"Rozpoznaj link: stat vs lstat vs readlink","group":"Dowiązania","summary":"Trzy różne pytania, trzy różne operacje.","code":"#define _POSIX_C_SOURCE 200809L\n#include <sys/stat.h>\n#include <unistd.h>\n#include <stdio.h>\n#include <stdlib.h>\n#include <inttypes.h>\nint main(int argc, char **argv) {\n    if (argc != 2) return 1;\n    struct stat a, b;\n    if (lstat(argv[1], &a) == -1) { perror(\"lstat\"); return 1; }\n    if (S_ISLNK(a.st_mode)) {\n        char target[4096];\n        ssize_t n = readlink(argv[1], target, sizeof target - 1);\n        if (n == -1) { perror(\"readlink\"); return 1; }\n        target[n] = '\\0';\n        printf(\"symlink contains: %s\\n\", target);\n    }\n    if (stat(argv[1], &b) == -1) perror(\"stat target\");\n    else printf(\"target size: %jd\\n\", (intmax_t)b.st_size);\n    return 0;\n}","explain":"<p><code>lstat<\/code> nie podąża za końcowym linkiem, <code>stat<\/code> podąża. W efekcie można otrzymać poprawne lstat oraz ENOENT z stat (wiszący link).<\/p>","gotchas":"<b>readlink<\/b> nie dopisuje znaku zerowego. Bufor 4096 może nie wystarczyć dla każdego przypadku.","keywords":"dangling link symlink target"},{"name":"Wielokrotne -p, jedno -o: szkielet getopt","group":"Argumenty CLI","summary":"Podstawa zadania 1: dynamiczna lista katalogów, odrzucenie drugiego -o i reszty argumentów.","code":"#define _POSIX_C_SOURCE 200809L\n#include <unistd.h>\n#include <stdio.h>\n#include <stdlib.h>\nint main(int argc, char **argv) {\n    char **paths = calloc((size_t)argc, sizeof *paths);\n    if (!paths) { perror(\"calloc\"); return 1; }\n    size_t path_count = 0;\n    const char *outfile = NULL;\n    opterr = 0;\n    int opt;\n    while ((opt = getopt(argc,argv,\"p:o:\")) != -1) {\n        switch (opt) {\n        case 'p': paths[path_count++] = optarg; break;\n        case 'o':\n            if (outfile) goto bad_cli;\n            outfile = optarg; break;\n        default: goto bad_cli;\n        }\n    }\n    if (optind != argc) goto bad_cli;\n    if (path_count == 0) paths[path_count++] = \".\";\n    FILE *out = stdout;\n    if (outfile && !(out = fopen(outfile, \"w\"))) {\n        perror(\"fopen\"); free(paths); return 1;\n    }\n    for (size_t i=0; i<path_count; i++)\n        fprintf(out, \"PATH: %s\\n\", paths[i]); // tu skanowanie\n    if (out != stdout && fclose(out) == EOF) {\n        perror(\"fclose\"); free(paths); return 1;\n    }\n    free(paths);\n    return 0;\nbad_cli:\n    fprintf(stderr,\"usage: %s [-p DIR]... [-o FILE]\\n\",argv[0]);\n    free(paths);\n    return 1;\n}","explain":"<p><code>getopt<\/code> nie sprawdza semantyki powtórzeń za Ciebie. Parametr <code>-p<\/code> może się powtarzać; <code>-o<\/code> wymaga unikalności. Dodatkowe argumenty pozycyjne po opcjach powinny zostać odrzucone.<\/p>","gotchas":"Jeśli plik output znajduje się w skanowanym katalogu, będzie on także widoczny w jego listingu.","keywords":"getopt paths -p -o duplicate example1"},{"name":"Zadanie 1: pełna funkcja listing + metadane","group":"Zadania","summary":"Wywołaj dla każdego -p, drukuj na dowolny FILE* i kontynuuj po nieistniejących katalogach.","code":"/* Wymaga: dirent.h, errno.h, inttypes.h, stdio.h, string.h,\\n   stdlib.h, sys/stat.h; POSIX_C_SOURCE=200809L */\nstatic int list_dir(const char *path, FILE *out) {\n    DIR *d = opendir(path);\n    if (!d) { perror(path); return -1; }\n    fprintf(out, \"SCIEZKA: %s\\nLISTA PLIKÓW:\\n\", path);\n    int failed = 0;\n    for (;;) {\n        errno = 0;\n        struct dirent *e = readdir(d);\n        if (!e) { if (errno) { perror(\"readdir\"); failed=1; } break; }\n        if (!strcmp(e->d_name,\".\") || !strcmp(e->d_name,\"..\")) continue;\n        size_t n = strlen(path) + strlen(e->d_name) + 2;\n        char *p = malloc(n);\n        if (!p) { perror(\"malloc\"); failed=1; break; }\n        snprintf(p,n,\"%s/%s\",path,e->d_name);\n        struct stat st;\n        if (lstat(p,&st) == -1) { perror(p); failed=1; }\n        else fprintf(out,\"%s %jd\\n\",e->d_name,(intmax_t)st.st_size);\n        free(p);\n    }\n    if (closedir(d)==-1) { perror(\"closedir\"); failed=1; }\n    return failed ? -1 : 0;\n}","explain":"<p>W głównej pętli wywołuj list_dir kolejno dla paths[i] nawet po błędzie jednego katalogu. Wypisz błąd na stderr, ale nie pomijaj pozostałych, zgodnie z zadaniem 1.<\/p>","gotchas":"Ustal, czy zadanie chce listować <code>.<\/code> i <code>..<\/code>. W zwykłych listingach studentów zwykle je pomijamy.","keywords":"listing output size readdir"},{"name":"Zadanie 2: filtrowanie po rozszerzeniu","group":"Zadania","summary":"Tylko końcówka nazwy po ostatniej kropce; ignoruj ukryte rozszerzenia jeśli takie wymaganie.","code":"#include <string.h>\nstatic int has_extension(const char *name, const char *ext) {\n    if (!ext) return 1;  // brak filtra\n    const char *dot = strrchr(name, '.');\n    if (!dot || dot == name || dot[1] == '\\0') return 0;\n    return strcmp(dot+1, ext) == 0;\n}\n/* has_extension(\"paper.txt\",\"txt\") == 1\n   has_extension(\"data.txt.bak\",\"txt\") == 0\n   has_extension(\".hidden\",\"hidden\") == 0 */","explain":"<p>Jeżeli w treści zadania filtr ma dotyczyć tylko regularnych plików, sprawdź najpierw <code>S_ISREG<\/code>. Podane <code>ext<\/code> to samo rozszerzenie bez kropki.<\/p>","gotchas":"Nazwy mogą zawierać wiele kropek, więc najważniejsza jest ostatnia.","keywords":"-e extension suffix"},{"name":"Zadanie 2: -o z L1_OUTPUTFILE","group":"Zadania","summary":"Dla flagi bez argumentu użyj optstring z samym o; nazwa pliku pochodzi ze środowiska.","code":"/* nagłówki: stdlib.h, stdio.h, unistd.h */\nint output_requested = 0;\n/* w switch(getopt(...,\"p:d:e:o\")): */\n/* case 'o': output_requested = 1; break; */\nFILE *out = stdout;\nif (output_requested) {\n    const char *name = getenv(\"L1_OUTPUTFILE\");\n    if (name && *name) {\n        out = fopen(name, \"w\");\n        if (!out) { perror(\"fopen\"); /* obsłuż błąd */ }\n    }\n    /* brak zmiennej: treść nie narzuca pliku; jawnie wybierz\n       politykę, np. pozostaw stdout lub zgłoś błąd */\n}\n/* ... używaj fprintf(out, ...) ... */\n/* if (out != stdout && fclose(out)==EOF) perror(\"fclose\"); */","explain":"<p>Uruchomienie: <code>L1_OUTPUTFILE=listing.txt ./prog -p ./dir1 -o<\/code>. Nie pisz <code>getopt(...,\"o:\")<\/code>, bo tu -o nie bierze wartości z CLI.<\/p>","gotchas":"Zadanie mówi „jeśli taka zmienna istnieje”. Dla braku zmiennej przyjmij spójną politykę i przetestuj ją.","keywords":"environment output flag"},{"name":"Jednoznaczne parsowanie liczby i oktalu","group":"Argumenty CLI","summary":"Walidacja base=8 lub base=10 ze wszystkimi typowymi błędami.","code":"#include <errno.h>\n#include <limits.h>\n#include <stdio.h>\n#include <stdlib.h>\nstatic int parse_long(const char *s, int base,\n                      long min, long max, long *out) {\n    if (!s || !*s) return -1;\n    errno = 0;\n    char *end;\n    long v = strtol(s, &end, base);\n    if (errno == ERANGE || end == s || *end != '\\0' ||\n        v < min || v > max) return -1;\n    *out = v;\n    return 0;\n}\n/* mode: parse_long(optarg,8,0,07777,&mode);\n   depth: parse_long(optarg,10,1,1000000,&depth); */","explain":"<p>Również wartości ujemne są odrzucane przez zakres. <code>strtol(\"0755\",...,8)<\/code> daje liczbę dziesiętnie równą 493, odpowiadającą prawom oktalnym 0755.<\/p>","gotchas":"Czasem potrzebujesz również odrzucić białe znaki na początku, bo strtol je akceptuje.","keywords":"strtol errors octal"},{"name":"Tworzenie pliku o dokładnym rozmiarze","group":"Pliki i strumienie","summary":"Stwórz plik długości SIZE bajtów; dziury systemu plików czytają się jako NUL.","code":"#define _POSIX_C_SOURCE 200809L\n#include <stdio.h>\n#include <sys/types.h>\n#include <unistd.h>\n#include <stdlib.h>\nint main(int argc, char **argv) {\n    if (argc != 2) return 1;\n    FILE *f = fopen(argv[1], \"wb+\");\n    if (!f) { perror(\"fopen\"); return 1; }\n    off_t size = 100000;\n    if (fflush(f) == EOF || ftruncate(fileno(f), size) == -1) {\n        perror(\"truncate\"); fclose(f); return 1;\n    }\n    if (fclose(f) == EOF) { perror(\"fclose\"); return 1; }\n    return 0;\n}","explain":"<p>Do stworzenia pliku SIZE z około 10% znaków A-Z dopisz po <code>ftruncate<\/code> <code>fseeko(f,...,SEEK_SET)<\/code> i <code>fputc<\/code>. Kolizje oznaczają, że liczba różnych nadpisanych bajtów jest mniejsza od liczby prób.<\/p>","gotchas":"Jeśli plik już istnieje i chcesz nadać nowe prawa, nie wystarczy samo otwarcie z „w”.","keywords":"ftruncate sparse zero fixed size"},{"name":"Tworzenie dokładnie 10% liter A-Z","group":"Pliki i strumienie","summary":"Bez kolizji: wypełnij losowo dobrane unikalne pozycje i zapisz kompletny bufor.","code":"/* Dla małych/średnich plików. Nagłówki: stdlib.h, stdio.h,\n   string.h, time.h; rozmiar n >0 i policzony bez overflow. */\nunsigned char *buf = calloc(n, 1);\nif (!buf) { perror(\"calloc\"); /* obsługa */ }\nsize_t chosen = n / 10;\n/* Fisher-Yates na tablicy indeksów; w praktyce alokuje O(n) */\nsize_t *pos = malloc(n * sizeof *pos);\nif (!pos) { perror(\"malloc\"); /* obsługa */ }\nfor (size_t i=0;i<n;i++) pos[i]=i;\nfor (size_t i=0;i<chosen;i++) {\n    size_t j = i + (size_t)(rand() % (n-i)); // uproszczone!\n    size_t t=pos[i]; pos[i]=pos[j]; pos[j]=t;\n    buf[pos[i]] = (unsigned char)('A'+rand()%26);\n}\nif (fwrite(buf,1,n,f) != n) perror(\"fwrite\");\nfree(pos); free(buf);","explain":"<p>Wartości n muszą być ≤ zakresu używanej metody losowania. Uproszczony <code>rand()%(n-i)<\/code> jest stronniczy i przy <code>n-i &gt; RAND_MAX+1<\/code> nie obsłuży całego zakresu. Do właściwego losowania szerokich zakresów użyj silniejszego generatora lub limituj rozmiar. To przykład schematu bez kolizji, nie kryptograficznego RNG.<\/p>","gotchas":"Wersja O(n) pamięci. Dla bardzo dużych rozmiarów wybierz algorytm strumieniowy bez dużego bufora.","keywords":"random letters 10% unique"},{"name":"Przełączanie praw przy tworzeniu","group":"Uprawnienia","summary":"fopen nie pozwala nadać x i nie zmienia uprawnień istniejącego inode. Najprościej chmod po utworzeniu.","code":"#include <stdio.h>\n#include <sys/stat.h>\nFILE *f = fopen(\"result\", \"wb\");\nif (!f) perror(\"fopen\");\nelse {\n    /* zapis danych... */\n    if (fclose(f) == EOF) perror(\"fclose\");\n    if (chmod(\"result\", 0755) == -1) perror(\"chmod\");\n}\n/* Zamiast chmod po nazwie można fchmod(fileno(f),0755)\n   PRZED fclose, unikając dodatkowego lookup ścieżki. */","explain":"<p>Gdy zadanie literalnie nakazuje usunięcie starego pliku, wywołaj <code>unlink(name)<\/code> i zignoruj wyłącznie ENOENT, potem nowy fopen i chmod.<\/p>","gotchas":"Race między fclose a chmod; jeśli bezpieczeństwo ważne, fchmod na otwartym fd i tryb O_EXCL.","keywords":"umask chmod perms"},{"name":"Dowięź symlink dokładnie o właściwym celu","group":"Dowiązania","summary":"Wybierz ../../ dla dwóch poziomów lub ../../../ dla trzech.","code":"#include <unistd.h>\n#include <stdio.h>\n/* Prawdziwy plik: library/wing/shelf/book */\n/* Link: index/by-title/Plato */\nif (symlink(\"../../library/wing/shelf/book\",\n            \"index/by-title/Plato\") == -1)\n    perror(\"symlink\");\n/* Link: index/by-genre/philosophy/Plato */\nif (symlink(\"../../../library/wing/shelf/book\",\n            \"index/by-genre/philosophy/Plato\") == -1)\n    perror(\"symlink\");","explain":"<p>Do weryfikacji: <code>readlink index/by-title/Plato<\/code> sprawdza tekst target, <code>stat -L index/by-title/Plato<\/code> sprawdza rozwiązywalność i metadane celu. Gdy <code>symlink<\/code> zwraca EEXIST, w zadaniu 4 jest to błąd kolizji tytułów/nazw.<\/p>","gotchas":"Cel nie istnieje? Sam symlink i tak powstanie.","keywords":"symlink index ../../ ../../../ example4"},{"name":"Readlink z dynamicznym buforem","group":"Dowiązania","summary":"Obsłuż długi link bez założenia maksymalnej stałej długości.","code":"#define _POSIX_C_SOURCE 200809L\n#include <errno.h>\n#include <stdlib.h>\n#include <unistd.h>\nstatic char *read_link(const char *path) {\n    size_t cap = 128;\n    for (;;) {\n        char *buf = malloc(cap + 1);\n        if (!buf) return NULL;\n        ssize_t n = readlink(path, buf, cap);\n        if (n == -1) { int e=errno; free(buf); errno=e; return NULL; }\n        if ((size_t)n < cap) { buf[n]='\\0'; return buf; }\n        free(buf);\n        if (cap > (size_t)-1 / 2 - 1) { errno=ENOMEM; return NULL; }\n        cap *= 2;\n    }\n}","explain":"<p>Wywołujący musi zwolnić wynik przez <code>free<\/code>. Gdy n==cap, nie wiadomo czy wynik jest dokładny, więc powiększamy bufor i powtarzamy.<\/p>","gotchas":"Między próbami link może się zmienić; to zwyczajna cecha wyścigów plikowych.","keywords":"readlink malloc no null"},{"name":"Zadanie 3: wpis i wykrywanie duplikatów","group":"Zadania","summary":"W pliku requirements wyszukaj nazwę pakietu, porównując token przed spacją.","code":"/* f = fopen(\"env/requirements\",\"r\");\n   package jest NUL-zakończony, line/cap zainicjowane */\nchar *line = NULL; size_t cap = 0;\nint exists = 0;\nssize_t n;\nwhile ((n = getline(&line, &cap, f)) != -1) {\n    char *space = strchr(line,' ');\n    if (!space) { fprintf(stderr,\"bad requirements line\\n\"); break; }\n    *space = '\\0';\n    if (!strcmp(line, package)) { exists=1; break; }\n}\nif (ferror(f)) perror(\"getline\");\nfree(line);\n/* fclose(f); if (exists) odrzuć instalację */","explain":"<p>Argument instalacji <code>numpy==1.2.0<\/code> podziel na nazwę i wersję przez <code>strstr(arg,\"==\")<\/code>, sprawdź że obie części są niepuste. Nie używaj zwykłego <code>strtok<\/code> do rozdzielania przy wielu zadaniach bez kontroli stanu.<\/p>","gotchas":"W pliku requirements mogą być błędne linie bez spacji: nie traktuj ich jak poprawny pakiet.","keywords":"requirements duplicate package manager"},{"name":"Zadanie 3: bezpieczne usuwanie linii requirements","group":"Zadania","summary":"Nie próbuj „usuwać środka” istniejącego pliku w trybie r+. Przepisz do pliku tymczasowego i atomowo podmień.","code":"/* Schemat operacyjny */\nFILE *in = fopen(\"env/requirements\", \"r\");\n/* ... sprawdź błędy ... */\nchar tmpl[] = \"env/.requirements.XXXXXX\";\nint fd = mkstemp(tmpl);\n/* ... sprawdź fd ... */\nFILE *out = fdopen(fd, \"w\");\n/* ... getline(&line,&cap,in) w pętli ... */\n/* jeśli nazwa != usuwana: fputs(line,out); */\n/* jeśli brak usuwanego pakietu: błąd i unlink(tmpl) */\n/* fflush(out), fclose(out), fclose(in), sprawdź błędy */\n/* jeśli wszystko ok: rename(tmpl,\"env/requirements\") */","explain":"<p>Wersja produkcyjna zachowuje tryb/owner pliku docelowego i może robić <code>fsync<\/code> dla trwałości. Do labu najważniejsze jest nieutracenie danych podczas błędu i brak próby „wycinania bajtów” w środku pliku.<\/p>","gotchas":"Po mkstemp udanym a fdopen nieudanym należy close(fd) i unlink(tmpl).","keywords":"remove package requirements temporary rename"},{"name":"Dokładne 68 bajtów przez readv, nawet przy krótkich odczytach","group":"Binaria","summary":"Pełny helper: prawidłowy EOF tylko pomiędzy rekordami; ucięty wpis jest błędem.","code":"#define _POSIX_C_SOURCE 200809L\n#include <sys/uio.h>\n#include <stdint.h>\n#include <string.h>\n#include <errno.h>\n#include <unistd.h>\nstatic int read_book_record(int fd, uint32_t *size, char title[65]) {\n    unsigned char bytes[4];\n    size_t done = 0;\n    while (done < 68) {\n        struct iovec iov[2]; int count = 0;\n        if (done < 4) {\n            iov[count++] = (struct iovec){bytes+done, 4-done};\n            iov[count++] = (struct iovec){title, 64};\n        } else {\n            iov[count++] = (struct iovec){title+done-4, 68-done};\n        }\n        ssize_t n = readv(fd,iov,count);\n        if (n == -1 && errno == EINTR) continue;\n        if (n == -1) return -1;\n        if (n == 0) {\n            if (done == 0) return 0; // EOF między wpisami\n            errno = EINVAL; return -1; // urwany wpis\n        }\n        done += (size_t)n;\n    }\n    memcpy(size,bytes,4);\n    title[64] = '\\0';\n    return 1;\n}","explain":"<p>Umieszczone dwa iovec są kluczowe dla wymagań zadania. <code>readv<\/code> wypełnia bufory po kolei. Po częściowym odczycie dostosowujesz początek i długości wektorów. Wynik: 1 = pełny rekord, 0 = koniec danych, -1 = błąd.<\/p>","gotchas":"Baza native endian; gdy wymagano by przenośności, trzeba jawnie wybrać endian oraz dekodować rozmiar.","keywords":"readv exact 68 retry"},{"name":"Porównanie rekordu bazy z by-title","group":"Binaria","summary":"Sprawdź brak książki i niezgodność długości wykorzystując właśnie symlink indeksu.","code":"/* size z bazy: uint32_t; title: char[65] zakończony NUL */\nchar path[512];\nint n = snprintf(path,sizeof path,\"index/by-title/%s\",title);\nif (n < 0 || (size_t)n >= sizeof path) {\n    fprintf(stderr,\"path too long\\n\"); /* błąd */\n} else {\n    struct stat st;\n    if (stat(path,&st) == -1) {\n        if (errno == ENOENT) printf(\"Book \\\"%s\\\" is missing\\n\",title);\n        else perror(path);\n    } else if (!S_ISREG(st.st_mode) || st.st_size != (off_t)size) {\n        printf(\"Book \\\"%s\\\" size mismatch (%u vs %jd)\\n\",\n               title,(unsigned)size,(intmax_t)st.st_size);\n    }\n}","explain":"<p>Wymaga <code>&lt;sys/stat.h&gt;<\/code>, <code>&lt;errno.h&gt;<\/code>, <code>&lt;inttypes.h&gt;<\/code> i <code>&lt;stdio.h&gt;<\/code>. Do produkcyjnego rozwiązania użyj dynamicznego join zamiast sztywnego path[512].<\/p>","gotchas":"Zadanie wyraźnie mówi, żeby do kontroli obecności użyć indeksu by-title, a nie ponownie skanować library.","keywords":"database stat missing mismatch"},{"name":"Zadanie 4: porządek indeksów i duplikaty","group":"Zadanie 4","summary":"Twórz katalog index tylko raz; dublowanie nazw przez symlink ma zwracać błąd.","code":"/* Etap 2: index NIE MOŻE już istnieć */\nif (mkdir(\"index\", 0755) == -1) { perror(\"index\"); exit(1); }\nif (mkdir(\"index/by-visible-title\",0755) == -1) { perror(\"mkdir\"); exit(1); }\n/* Etap 3 */\nif (mkdir(\"index/by-title\",0755) == -1) { perror(\"mkdir\"); exit(1); }\nif (mkdir(\"index/by-genre\",0755) == -1) { perror(\"mkdir\"); exit(1); }\n/* Gdy genre dir już istnieje: EEXIST jest normalne TYLKO\n   jeśli to katalog; gdy link/nazwa koliduje: EEXIST fatalny. */","explain":"<p>Każdy zwykły plik niezależnie od pól metadata dostaje indeks <code>by-visible-title<\/code>. Dla braku <code>title<\/code> pomiń <code>by-title<\/code> i <code>by-genre<\/code>. Dla braku <code>genre<\/code> pozostaje <code>by-title<\/code>.<\/p>","gotchas":"Duplikaty widocznych nazw z różnych półek są błędem, mimo że ich pełne ścieżki są inne.","keywords":"index by visible by genre title duplicates"},{"name":"Checklista awarii w 60 sekund","group":"Błędy","summary":"Gdy program nie działa: triage od argumentu i środowiska do metadanych i symlinków.","code":"# 1. Odtwórz w małym katalogu\npwd; ls -la\n# 2. Zbadaj każdy komponent ścieżki\nnamei -l 'index/by-title/My Book'\n# 3. Porównaj link i cel\nls -l 'index/by-title/My Book'\nreadlink 'index/by-title/My Book'\nstat 'index/by-title/My Book'\nstat -L 'index/by-title/My Book'\n# 4. Rozdziel stdout/stderr\n./prog >out.log 2>err.log\n# 5. Zobacz dokładny format binarny\nod -An -tx1 -v database_correct | head\n# 6. Użyj sanitizera (podaj swój plik źródłowy)\ngcc -std=c11 -D_POSIX_C_SOURCE=200809L -g \\\n  -fsanitize=address,undefined main.c -o prog","explain":"<p>Jeżeli symlink istnieje, ale <code>stat(link)<\/code> daje ENOENT, sprawdź czy target względny nie był omyłkowo liczony od CWD programu.<\/p>","gotchas":"<code>errno<\/code> jest użyteczne tylko w kontekście konkretnego nieudanego wywołania.","keywords":"debug quick errors"},{"name":"Lista gotowych nagłówków dla L1","group":"Start","summary":"Skopiuj zestaw kompatybilny z C11 + POSIX. Nie każdy nagłówek musi być wymagany w każdym zadaniu.","code":"#define _POSIX_C_SOURCE 200809L\n#include <dirent.h>      // DIR, readdir, closedir\n#include <errno.h>       // errno, EEXIST, ENOENT\n#include <fcntl.h>       // open, O_RDONLY\n#include <inttypes.h>    // intmax_t, PRIu32\n#include <stdint.h>      // uint32_t\n#include <stdio.h>       // FILE, fopen, getline, perror\n#include <stdlib.h>      // malloc, free, strtol, exit\n#include <string.h>      // strcmp, strchr, strdup\n#include <sys/stat.h>    // stat, lstat, mkdir, chmod\n#include <sys/types.h>   // mode_t, off_t, ssize_t\n#include <sys/uio.h>     // readv, struct iovec\n#include <time.h>        // time\n#include <unistd.h>      // getopt, chdir, readlink, symlink","explain":"<p>Feature test macro musi wystąpić przed dowolnym <code>#include<\/code>. <code>errno<\/code> to makro dostępowe, nie deklaruj osobno globalnej zmiennej errno.<\/p>","gotchas":"","keywords":"headers template"},{"name":"Zadanie 1: kompletna implementacja","group":"Zadania","summary":"Działający pełny program: wielokrotne -p, jednorazowe -o, listing wszystkich typów obiektów i ich rozmiarów, raport błędu katalogu na stderr oraz kontynuacja następnego.","code":"#define _POSIX_C_SOURCE 200809L\n#include <dirent.h>\n#include <errno.h>\n#include <inttypes.h>\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <sys/stat.h>\n#include <unistd.h>\n\nstatic int list_dir(const char *path, FILE *out) {\n    DIR *d = opendir(path);\n    if (!d) { perror(path); return -1; }\n    fprintf(out, \"SCIEZKA:\\n  %s\\nLISTA PLIKOW:\\n\", path);\n    int bad = 0;\n    for (;;) {\n        errno = 0;\n        struct dirent *e = readdir(d);\n        if (!e) { if (errno) { perror(\"readdir\"); bad=1; } break; }\n        if (!strcmp(e->d_name, \".\") || !strcmp(e->d_name, \"..\")) continue;\n        size_t n = strlen(path) + strlen(e->d_name) + 2;\n        char *full = malloc(n);\n        if (!full) { perror(\"malloc\"); bad=1; break; }\n        snprintf(full, n, \"%s/%s\", path, e->d_name);\n        struct stat st;\n        if (lstat(full, &st) == -1) { perror(full); bad=1; }\n        else fprintf(out, \"  %s %jd\\n\", e->d_name, (intmax_t)st.st_size);\n        free(full);\n    }\n    if (closedir(d) == -1) { perror(\"closedir\"); bad=1; }\n    return bad
