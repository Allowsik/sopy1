?-1:0;\n}\nint main(int argc, char **argv) {\n    char **paths = calloc((size_t)argc+1, sizeof *paths);\n    if (!paths) { perror(\"calloc\"); return 1; }\n    size_t count = 0;\n    const char *output = NULL;\n    int c; opterr=0;\n    while ((c = getopt(argc, argv, \"p:o:\")) != -1) {\n        switch(c) {\n        case 'p': paths[count++]=optarg; break;\n        case 'o': if (output) goto usage; output=optarg; break;\n        default: goto usage;\n        }\n    }\n    if (optind != argc) goto usage;\n    if (count==0) paths[count++]=\".\";\n    FILE *out = stdout;\n    if (output && !(out=fopen(output, \"w\"))) { perror(output); free(paths); return 1; }\n    int had_error=0;\n    for (size_t i=0; i<count; i++)\n        if (list_dir(paths[i], out) != 0) had_error=1; // continue\n    if (out!=stdout && fclose(out)==EOF) { perror(\"fclose\"); had_error=1; }\n    free(paths);\n    return had_error ? 1 : 0;\nusage:\n    fprintf(stderr, \"usage: %s [-p DIR]... [-o OUTPUT]\\n\", argv[0]);\n    free(paths);\n    return 1;\n}\n","explain":"<p>Kompilacja: <code>gcc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Wpedantic main.c -o prog<\/code>. Przykład: <code>./prog -p /run -p /var -o wyniki.txt<\/code>. Sprawdza powtórzone -o i dodatkowe argumenty.<\/p>","gotchas":"W zadaniu trzeba wybrać politykę kodu wyjścia po błędzie pojedynczego katalogu; tutaj cała operacja kończy się niezerowym kodem, ale pozostałe katalogi są przetwarzane.","keywords":"full example1 opendir getopt"},{"name":"Zadanie 2: kompletna implementacja","group":"Zadania","summary":"Działający pełny program: -p powtarzalne, -e rozszerzenie, -d głębokość, -o kieruje wyjście do zmiennej L1_OUTPUTFILE.","code":"#define _POSIX_C_SOURCE 200809L\n#include <dirent.h>\n#include <errno.h>\n#include <inttypes.h>\n#include <stdint.h>\n#include <limits.h>\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <sys/stat.h>\n#include <unistd.h>\n\nstatic char *join(const char *a, const char *b) {\n    size_t x=strlen(a),y=strlen(b);\n    if (x > SIZE_MAX-y-2) { errno=ENOMEM; return NULL; }\n    char *s=malloc(x+y+2);\n    if (s) snprintf(s,x+y+2,\"%s/%s\",a,b);\n    return s;\n}\nstatic int match(const char *name,const char *ext) {\n    if (!ext) return 1;\n    const char *dot=strrchr(name,'.');\n    return dot && dot!=name && strcmp(dot+1,ext)==0;\n}\nstatic int scan(const char *path,long level,long max_depth,const char *ext,FILE *out) {\n    DIR *d=opendir(path);\n    if (!d) { perror(path); return -1; }\n    fprintf(out,\"path: %s\\n\",path);\n    int bad=0;\n    for (;;) {\n        errno=0;\n        struct dirent *e=readdir(d);\n        if (!e) { if (errno) { perror(\"readdir\"); bad=1; } break; }\n        if (!strcmp(e->d_name,\".\") || !strcmp(e->d_name,\"..\")) continue;\n        char *full=join(path,e->d_name);\n        if (!full) { perror(\"malloc\"); bad=1; break; }\n        struct stat st;\n        if (lstat(full,&st)==-1) { perror(full); bad=1; }\n        else if (S_ISDIR(st.st_mode) && level < max_depth) {\n            if (scan(full,level+1,max_depth,ext,out)!=0) bad=1;\n        } else if (S_ISREG(st.st_mode) && match(e->d_name,ext)) {\n            fprintf(out,\"%s %jd\\n\",e->d_name,(intmax_t)st.st_size);\n        }\n        free(full);\n        if (bad) break;\n    }\n    if (closedir(d)==-1) { perror(\"closedir\"); bad=1; }\n    return bad?-1:0;\n}\nint main(int argc,char **argv) {\n    char **paths=calloc((size_t)argc+1,sizeof *paths);\n    if (!paths) { perror(\"calloc\"); return 1; }\n    size_t count=0; const char *ext=NULL; long depth=1;\n    int redirect=0,c; opterr=0;\n    while ((c=getopt(argc,argv,\"p:d:e:o\"))!=-1) {\n        switch(c) {\n        case 'p': paths[count++]=optarg; break;\n        case 'e': ext=optarg; break;\n        case 'o': redirect=1; break;\n        case 'd': {\n            errno=0; char *end;\n            long n=strtol(optarg,&end,10);\n            if (errno==ERANGE || end==optarg || *end || n<1 || n==LONG_MAX)\n                goto usage;\n            depth=n;\n            break;\n        }\n        default: goto usage;\n        }\n    }\n    if (optind!=argc) goto usage;\n    if (count==0) paths[count++]=\".\";\n    FILE *out=stdout;\n    if (redirect) {\n        const char *outpath=getenv(\"L1_OUTPUTFILE\");\n        if (outpath && *outpath) {\n            out=fopen(outpath,\"w\");\n            if (!out) { perror(outpath); free(paths); return 1; }\n        }\n    }\n    int bad=0;\n    for (size_t i=0;i<count;i++) if (scan(paths[i],1,depth,ext,out)!=0) bad=1;\n    if (out!=stdout && fclose(out)==EOF) { perror(\"fclose\"); bad=1; }\n    free(paths); return bad?1:0;\nusage:\n    fprintf(stderr,\"usage: %s [-p DIR]... [-e EXT] [-d DEPTH] [-o]\\n\",argv[0]);\n    free(paths); return 1;\n}\n","explain":"<p>Przykład: <code>L1_OUTPUTFILE=wynik.txt ./prog -p ./dir1 -p ./dir2 -d 2 -e txt -o<\/code>. Głębokość 1 = tylko katalog startowy. Wpisy do katalogów drukowane są nawet, gdy nie ma plików spełniających filtr.<\/p>","gotchas":"Brak L1_OUTPUTFILE przy -o oznacza w tej wersji stdout; specyfikacja nie nakazuje wówczas konkretnego błędu. Symlink-katalogi są pomijane podczas rekursji.","keywords":"full example2 recursion depth getenv"},{"name":"Zadanie 3: kompletna implementacja","group":"Zadania","summary":"Działający pełny program sop-venv: tworzenie środowiska, instalacja NAME==VERSION do wielu -v, wykrywanie duplikatów, chmod 0444 i usuwanie pakietów.","code":"#define _POSIX_C_SOURCE 200809L\n#include <errno.h>\n#include <fcntl.h>\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <sys/stat.h>\n#include <unistd.h>\n#include <time.h>\n#include <stdint.h>\n\nstatic void fail(const char *what) { perror(what); exit(EXIT_FAILURE); }\nstatic void usage(const char *prog) {\n    fprintf(stderr, \"usage: %s -c -v ENV | -c ENV | -v ENV [-v ENV...] (-i NAME==VERSION | -r NAME)\\n\", prog);\n    exit(EXIT_FAILURE);\n}\nstatic int safe_name(const char *s) {\n    if (!s || !*s || !strcmp(s,\".\") || !strcmp(s,\"..\")) return 0;\n    for (;*s;s++) if (*s=='/' || *s=='\\n' || *s=='\\r' || *s==' ' || *s=='\\t') return 0;\n    return 1;\n}\nstatic char *path_of(const char *env, const char *name) {\n    size_t x=strlen(env),y=strlen(name);\n    if (x > SIZE_MAX-y-2) { errno=ENOMEM; fail(\"path overflow\"); }\n    char *p=malloc(x+y+2);\n    if (!p) fail(\"malloc\");\n    snprintf(p,x+y+2,\"%s/%s\",env,name);\n    return p;\n}\nstatic void create_environment(const char *env) {\n    if (!safe_name(env)) { fprintf(stderr,\"Bad env name\\n\"); exit(1); }\n    if (mkdir(env,0755)==-1) fail(\"mkdir environment\");\n    char *req=path_of(env,\"requirements\");\n    int fd=open(req,O_WRONLY|O_CREAT|O_EXCL,0644);\n    if (fd==-1) fail(\"create requirements\");\n    if (close(fd)==-1) fail(\"close requirements\");\n    free(req);\n}\nstatic int exists(FILE *f, const char *package) {\n    char *line=NULL; size_t cap=0; ssize_t n;\n    int found=0;\n    while ((n=getline(&line,&cap,f))!=-1) {\n        char *space=strchr(line,' ');\n        if (!space) { fprintf(stderr,\"Corrupt requirements\\n\"); exit(1); }\n        *space='\\0';\n        if (!strcmp(line,package)) { found=1; break; }\n    }\n    if (ferror(f)) fail(\"getline requirements\");\n    free(line);\n    return found;\n}\nstatic void install_one(const char *env, const char *pkg, const char *version) {\n    char *req=path_of(env,\"requirements\");\n    FILE *in=fopen(req,\"r\");\n    if (!in) fail(\"open requirements\");\n    int present=exists(in,pkg);\n    if (fclose(in)==EOF) fail(\"fclose requirements\");\n    if (present) { fprintf(stderr,\"Package already installed: %s\\n\",pkg); exit(1); }\n    char *dst=path_of(env,pkg);\n    int fd=open(dst,O_WRONLY|O_CREAT|O_EXCL,0644);\n    if (fd==-1) fail(\"create package file\");\n    unsigned char data[64];\n    for (size_t i=0;i<sizeof data;i++) data[i]=(unsigned char)('A'+rand()%26);\n    size_t done=0;\n    while(done<sizeof data) {\n        ssize_t n=write(fd,data+done,sizeof data-done);\n        if (n<0 && errno==EINTR) continue;\n        if (n<=0) fail(\"write package\");\n        done+=(size_t)n;\n    }\n    if (fchmod(fd,0444)==-1) fail(\"fchmod package\");\n    if (close(fd)==-1) fail(\"close package\");\n    FILE *out=fopen(req,\"a\");\n    if (!out) fail(\"append requirements\");\n    if (fprintf(out,\"%s %s\\n\",pkg,version)<0) fail(\"fprintf requirements\");\n    if (fclose(out)==EOF) fail(\"fclose requirements\");\n    free(dst); free(req);\n}\nstatic void remove_one(const char *env, const char *pkg) {\n    char *req=path_of(env,\"requirements\");\n    FILE *in=fopen(req,\"r\");\n    if (!in) fail(\"open requirements\");\n    if (!exists(in,pkg)) { fprintf(stderr,\"Package not installed: %s\\n\",pkg); exit(1); }\n    if (fclose(in)==EOF) fail(\"fclose requirements\");\n    in=fopen(req,\"r\");\n    if (!in) fail(\"reopen requirements\");\n    char *tmpl=path_of(env,\".requirements.XXXXXX\");\n    int fd=mkstemp(tmpl);\n    if (fd==-1) fail(\"mkstemp\");\n    FILE *out=fdopen(fd,\"w\");\n    if (!out) fail(\"fdopen\");\n    char *line=NULL; size_t cap=0; ssize_t n;\n    while ((n=getline(&line,&cap,in))!=-1) {\n        char *space=strchr(line,' ');\n        if (!space) { fprintf(stderr,\"Corrupt requirements\\n\"); exit(1); }\n        size_t length=(size_t)(space-line);\n        if (strlen(pkg)==length && strncmp(line,pkg,length)==0) continue;\n        if (fputs(line,out)==EOF) fail(\"fputs temp requirements\");\n    }\n    if (ferror(in)) fail(\"read requirements\");\n    free(line);\n    if (fclose(in)==EOF) fail(\"fclose input requirements\");\n    if (fclose(out)==EOF) fail(\"fclose temporary requirements\");\n    if (rename(tmpl,req)==-1) fail(\"rename requirements\");\n    char *file=path_of(env,pkg);\n    if (unlink(file)==-1) fail(\"unlink package\");\n    free(file); free(tmpl); free(req);\n}\nint main(int argc, char **argv) {\n    int c,create=0;\n    char **envs=calloc((size_t)argc+1,sizeof *envs);\n    if (!envs) fail(\"calloc\");\n    size_t count=0;\n    const char *install=NULL,*remove=NULL;\n    opterr=0;\n    while((c=getopt(argc,argv,\"cv:i:r:\"))!=-1) {\n        switch(c) {\n        case 'c': if(create++) usage(argv[0]); break;\n        case 'v': envs[count++]=optarg; break;\n        case 'i': if(install) usage(argv[0]); install=optarg; break;\n        case 'r': if(remove) usage(argv[0]); remove=optarg; break;\n        default: usage(argv[0]);\n        }\n    }\n    if (create) {\n        if (install || remove) usage(argv[0]);\n        if (count==0 && optind+1==argc) envs[count++]=argv[optind++];\n        if (count!=1 || optind!=argc) usage(argv[0]);\n        create_environment(envs[0]);\n        free(envs); return 0;\n    }\n    if (optind!=argc || count==0 || (!!install)==(!!remove)) usage(argv[0]);\n    char *name=NULL;\n    const char *version=NULL;\n    if (install) {\n        const char *eq=strstr(install,\"==\");\n        if (!eq || eq==install || !eq[2]) usage(argv[0]);\n        name=strndup(install,(size_t)(eq-install));\n        if (!name) fail(\"strndup\");\n        version=eq+2;\n    } else {\n        name=strdup(remove);\n        if (!name) fail(\"strdup\");\n    }\n    if (!safe_name(name) || (version && !safe_name(version)) ||\n        !strcmp(name,\"requirements\")) usage(argv[0]);\n    srand((unsigned)time(NULL));\n    for(size_t i=0;i<count;i++) {\n        if (!safe_name(envs[i])) usage(argv[0]);\n        struct stat st;\n        if (stat(envs[i],&st)==-1 || !S_ISDIR(st.st_mode)) {\n            fprintf(stderr,\"Environment does not exist: %s\\n\",envs[i]);\n            return 1;\n        }\n        if (install) install_one(envs[i],name,version);\n        else remove_one(envs[i],name);\n    }\n    free(name); free(envs);\n    return 0;\n}\n","explain":"<p>Obsługuje <code>./prog -c -v env<\/code> oraz <code>./prog -c env<\/code>, <code>./prog -v env1 -v env2 -i numpy==1.0.0<\/code>, <code>./prog -v env1 -r numpy<\/code>. Usuwanie przepisuje requirements do pliku tymczasowego i podmienia przez rename. Kod skompilowany i przetestowany na dwóch środowiskach.<\/p>","gotchas":"Demonstracja nie zapewnia pełnych transakcji przy awarii pomiędzy zmianą requirements a usunięciem pliku, nie stosuje blokad przy współbieżnych wywołaniach oraz zakłada proste nazwy pakietów bez spacji i ukośników.","keywords":"full example3 package manager install remove"}],"errors":[{"symbol":"ENOENT","meaning":"Brak pliku lub składowej ścieżki","likely":"stat / fopen / chdir / unlink / realpath; zerwany symlink","fix":"Sprawdź ls -la, nazwę, CWD, wielkość liter; przy unlink nieistniejącego pliku czasem wolno zignorować."},{"symbol":"EACCES","meaning":"Brak pozwolenia","likely":"Brak x na katalogu pośrednim, brak r katalogu przy opendir, brak w na rodzicu","fix":"Sprawdź namei -l PATH, id, ls -ld katalogi; w katalogu x=przejście, w=zmiana wpisów."},{"symbol":"EPERM","meaning":"Operacja niedozwolona","likely":"chmod bez własności, sticky bit, hardlink chroniony polityką","fix":"Nie myl z EACCES; sprawdź właściciela, sticky bit, atrybuty i uprawnienia."},{"symbol":"ENOTDIR","meaning":"Element ścieżki nie jest katalogiem","likely":"Odwiedzanie plik/foo albo opendir na zwykłym pliku","fix":"Ustal, który komponent path nie jest katalogiem; lstat rodzica."},{"symbol":"EISDIR","meaning":"Cel jest katalogiem, a oczekiwano pliku","likely":"fopen do zapisu na katalogu, unlink katalogu","fix":"Użyj rmdir dla pustego katalogu lub popraw błędną ścieżkę."},{"symbol":"EEXIST","meaning":"Nazwa już zajęta","likely":"mkdir, symlink, link, open O_EXCL","fix":"Dla zad.4 powtarzająca się nazwa ma być BŁĘDEM; nie nadpisuj po cichu."},{"symbol":"ENOTEMPTY","meaning":"Katalog nie jest pusty","likely":"rmdir katalogu z wpisami","fix":"Usuń wpisy, jeśli zadanie pozwala, lub poinformuj o błędzie."},{"symbol":"ELOOP","meaning":"Za dużo symlinków podczas rozwiązywania ścieżki","likely":"A->B->A, powtarzające się przekierowania","fix":"Sprawdź ls -l, readlink; w rekursji użyj lstat i nie wchodź w symlink-katalog."},{"symbol":"ENAMETOOLONG","meaning":"Zbyt długa nazwa lub ścieżka","likely":"Wiele zagnieżdżeń, nazwa > NAME_MAX","fix":"Używaj dynamicznych buforów, sprawdź pathconf i skróć nazwę."},{"symbol":"EMFILE","meaning":"Proces otworzył zbyt wiele plików","likely":"Brak fclose/closedir/close przy rekurencji","fix":"Zamykaj zasoby, ulimit -n, pilnuj głębokości rekursji."},{"symbol":"ENFILE","meaning":"Systemowy limit otwartych plików","likely":"Zbyt dużo otwartych fd globalnie","fix":"Zamykaj deskryptory; to nie to samo co EMFILE."},{"symbol":"EBADF","meaning":"Niepoprawny lub zamknięty deskryptor","likely":"readv na -1 lub fd po close","fix":"Sprawdź rezultat open/fileno i cykl życia deskryptora."},{"symbol":"EINVAL","meaning":"Nieprawidłowy argument","likely":"readv iovcnt=0, zły whence, długość <0","fix":"Przeczytaj zakresy argumentów i sprawdź wartości wejściowe."},{"symbol":"ERANGE","meaning":"Wynik poza zakresem / za mały bufor","likely":"strtol przepełnienie, getcwd za mały bufor","fix":"Przy strtol sprawdź errno==ERANGE i końcówkę; dla getcwd powiększ bufor."},{"symbol":"EOVERFLOW","meaning":"Nie można reprezentować liczby","likely":"stat na olbrzymich plikach, ftell dla long","fix":"Używaj off_t i wariantów fseeko/ftello, odpowiednich typów."},{"symbol":"ENOSPC","meaning":"Brak miejsca na urządzeniu","likely":"fwrite/fclose/mkdir/symlink","fix":"Błędy opóźnione mogą wyjść dopiero przy fflush/fclose. df -h."},{"symbol":"EDQUOT","meaning":"Przekroczony przydział miejsca (quota)","likely":"Zapisy, tworzenie nowych wpisów","fix":"Sprawdź quota, zmniejsz zużycie."},{"symbol":"EROFS","meaning":"System plików tylko do odczytu","likely":"mkdir/unlink/chmod na read-only","fix":"Sprawdź mount, prawa i docelowy filesystem."},{"symbol":"EXDEV","meaning":"Różne systemy plików","likely":"rename/link między urządzeniami","fix":"Nie można hardlinkować między FS; rename zastąp copy+unlink, jeśli dopuszczalne."},{"symbol":"ESPIPE","meaning":"Brak możliwości seek","likely":"fseek/fseeko na pipe, stdin z terminala","fix":"Buforuj dane, nie zakładaj losowego dostępu do każdego strumienia."},{"symbol":"EINTR","meaning":"Operacja przerwana przez sygnał","likely":"read/readv/close i niektóre IO","fix":"Na odczycie często ponów, jeśli semantyka pozwala; dla close nie ponawiaj bezmyślnie."},{"symbol":"EAGAIN","meaning":"Dane chwilowo niedostępne","likely":"Nonblocking fd, limit zasobów","fix":"W nieblokującym IO spróbuj później; nie spinuj CPU bez opóźnienia."},{"symbol":"ENOMEM","meaning":"Brak pamięci","likely":"malloc/getline/strdup/readv","fix":"Sprawdź NULL, zwalniaj zasoby, pilnuj rozmiarów alokacji."},{"symbol":"EIO","meaning":"Błąd wejścia/wyjścia","likely":"Odczyt/zapis/kasowanie metadanych","fix":"To błąd urządzenia/systemu; nie interpretuj jako EOF."},{"symbol":"EFBIG","meaning":"Plik zbyt duży","likely":"fwrite/ftruncate przekracza limity","fix":"Sprawdź rozmiary, filesystem i ulimit -f."},{"symbol":"EMLINK","meaning":"Przekroczony limit dowiązań","likely":"link do inode o maksymalnej liczbie hardlinków","fix":"Nie twórz kolejnego hardlinka, przenieś/kopiuj dane."},{"symbol":"EFAULT","meaning":"Błędny adres pamięci","likely":"readv ze wskaźnikiem spoza przestrzeni adresowej","fix":"Zbadaj iov_base, alokację, lifetime bufora."},{"symbol":"EPIPE","meaning":"Pisanie do zamkniętego pipe","likely":"write/fwrite do potoku bez odbiorcy","fix":"Obsłuż SIGPIPE/EPIPE odpowiednio do programu."},{"symbol":"EBUSY","meaning":"Obiekt zajęty","likely":"Usuwanie lub zmiana aktywnego mountpointu","fix":"Sprawdź mount / uruchomione procesy."},{"symbol":"ENOSYS","meaning":"Funkcja niezaimplementowana","likely":"Brak wsparcia syscall w danym systemie","fix":"Zobacz sekcję STANDARDS oraz wersję kernela/OS."},{"symbol":"ENOTSUP / EOPNOTSUPP","meaning":"Funkcja nieobsługiwana dla obiektu","likely":"Operacje specyficzne dla FS","fix":"Zmień strategię lub filesystem; kody mogą być aliasami."}],"concepts":[{"title":"Mapa laboratorium L1","group":"Start","content":"<p>Zakres bazowy: <b>DIR* + readdir<\/b>, <b>stat/lstat<\/b>, aktualny katalog, <b>FILE*<\/b>, prawa/umask, <b>symlink<\/b> i buforowanie stdio. Przykładowe zadania dokładają <b>getopt<\/b>, rekurencję, filtrowanie, parser key:value, zmienne środowiskowe, indeksowanie, a w zad. 4 nawet <b>readv<\/b> i format binarny. Niskopoziomowe deskryptory są zasadniczo przedmiotem L2, ale readv wymaga ich w zadaniu 4.<\/p><p><b>Zasada podczas labów:<\/b> najpierw rozpoznaj, czy potrzebujesz działać na nazwach, metadanych, strumieniu czy deskryptorze. Potem odszukaj API, sprawdź wartość zwrotną, obsłuż errno i zwolnij zasoby.<\/p>","keywords":"scope checklist"},{"title":"Wybór funkcji w 5 sekund","group":"Start","content":"<table><tr><th>Cel<\/th><th>Funkcja<\/th><th>Gdy coś nie działa<\/th><\/tr><tr><td>Wypisać zawartość katalogu<\/td><td><code>opendir → readdir → closedir<\/code><\/td><td>Sprawdź <code>errno=0<\/code> przed <code>readdir<\/code><\/td><\/tr><tr><td>Odróżnić link/katalog/plik<\/td><td><code>lstat → S_IS*<\/code><\/td><td><code>stat<\/code> ukryje ostatni symlink<\/td><\/tr><tr><td>Rozmiar docelowego pliku<\/td><td><code>stat<\/code> i <code>st_size<\/code><\/td><td>Przy uszkodzonym linku: <code>ENOENT<\/code><\/td><\/tr><tr><td>Zrobić indeks symlinków<\/td><td><code>mkdir + symlink<\/code><\/td><td>Cel względny licz od katalogu linku<\/td><\/tr><tr><td>Wczytać metadane linia po linii<\/td><td><code>getline + strchr + strcmp<\/code><\/td><td><code>free(line)<\/code> i <code>ferror<\/code><\/td><\/tr><tr><td>Zapisać wyniki lub plik<\/td><td><code>fopen + fprintf/fwrite + fclose<\/code><\/td><td>Tryb w ucina plik, a append dopisuje<\/td><\/tr><tr><td>Wczytać rekord binarny 4+64<\/td><td><code>open + readv + close<\/code><\/td><td>Obsłuż krótki odczyt i urwany rekord<\/td><\/tr><tr><td>Zmienić uprawnienia<\/td><td><code>chmod<\/code><\/td><td>Właściciel/capability, nie samo prawo zapisu<\/td><\/tr><\/table>","keywords":"cheatsheet mapa"},{"title":"Sekcje man i jak czytać","group":"Manual","content":"<p><code>man 1<\/code> polecenia shellowe; <code>man 2<\/code> syscalle Linuksa; <code>man 3<\/code> biblioteka C; <code>man 3p<\/code> interfejsy POSIX; <code>man 0p<\/code> pliki nagłówkowe POSIX; <code>man 5<\/code> formaty plików; <code>man 7<\/code> pojęcia i przeglądy.<\/p><p><b>Skuteczna kolejność czytania<\/b>: NAME → SYNOPSIS (header i prototyp) → DESCRIPTION (argumenty) → RETURN VALUE → ERRORS → NOTES / CAVEATS → EXAMPLES → SEE ALSO. Jeśli dokumentacja <code>3p<\/code> w systemie jest niedostępna, sprawdź <code>man 3<\/code> i <code>man 2<\/code>. Dla <code>opendir<\/code> strona POSIX może być pod nazwą <code>fdopendir(3p)<\/code>, a dla <code>stat<\/code> pod <code>fstatat(3p)<\/code>.<\/p><p><b>Skróty w czytniku<\/b>: <code>/tekst<\/code> wyszukuje, <code>n<\/code> następne dopasowanie, <code>N<\/code> poprzednie, <code>g/G<\/code> początek/koniec, <code>q<\/code> wyjście, <code>h<\/code> pomoc. <code>man -k tematyka<\/code> przeszukuje opisy. <code>man -f nazwa<\/code> pokazuje nazwę i krótką definicję. <code>man -a nazwa<\/code> przewija wersje z kilku sekcji.<\/p>","keywords":"how read manpage apropos grep"},{"title":"Jak czytać SYNOPSIS","group":"Manual","content":"<p><code>#include &lt;unistd.h&gt;<\/code> to wymagany nagłówek. <code>restrict<\/code> to obietnica braku nakładania się odpowiednio używanych zakresów pamięci, nie magiczny sposób na zwiększenie szybkości. <code>const char *<\/code> oznacza dane, których funkcja nie modyfikuje. <code>char **<\/code> to wskaźnik na wskaźnik, np. getline może zmieniać adres bufora. <code>void *<\/code> wskaźnik do dowolnych bajtów. <code>size_t<\/code> bez znaku, <code>ssize_t<\/code> ze znakiem. <code>mode_t<\/code> maska praw, <code>off_t<\/code> offset.<\/p><p>Jeśli manual podaje <code>_POSIX_C_SOURCE &gt;= 200809L<\/code>, dopisz <code>#define _POSIX_C_SOURCE 200809L<\/code> na samym początku pliku przed nagłówkami albo opcję kompilatora <code>-D_POSIX_C_SOURCE=200809L<\/code>.<\/p>","keywords":"restrict prototype declaration define"},{"title":"Wartości zwrotne i errno","group":"Błędy","content":"<p><b>Różne API mają różne konwencje.<\/b> <code>stat/mkdir/chmod/symlink/closedir<\/code>: <code>0/-1<\/code>. <code>fopen/opendir<\/code>: wskaźnik/NULL. <code>readdir<\/code>: wskaźnik lub NULL przy końcu i błędzie, więc <code>errno=0<\/code>. <code>fread/fwrite<\/code>: liczba elementów, a nie -1. <code>readv/read<\/code>: liczba bajtów, 0=EOF, -1=błąd. <code>umask<\/code>: stara maska, nigdy -1 jako sygnał błędu. <code>getline<\/code>: bajty/-1 przy EOF lub błędzie.<\/p><p><b>Nie sprawdzaj errno po sukcesie<\/b> i nie zakładaj, że errno automatycznie zeruje się po powodzeniu. Używaj perror natychmiast po nieudanym wywołaniu albo zachowaj wartość w int.<\/p>","keywords":"return values"},{"title":"Przepływ ścieżek / CWD","group":"Ścieżki","content":"<p>Ścieżka absolutna zaczyna się od <code>/<\/code>. Ścieżka względna w zwykłych funkcjach (<code>opendir<\/code>, <code>stat<\/code>, <code>fopen<\/code>) liczona jest od <b>aktualnego katalogu procesu<\/b>. Wyjątek znaczący dla L1: <b>tekst celu względnego symlinka<\/b> jest rozwiązywany z katalogu, w którym leży link.<\/p><p>Przykład: link <code>index/by-title/Platon<\/code>, prawdziwy plik <code>library/room/a<\/code>. Cel ma brzmieć <code>../../library/room/a<\/code>, bo z <code>index/by-title<\/code> wracasz dwa poziomy. W podkatalogu <code>index/by-genre/philosophy<\/code> musisz cofnąć trzy: <code>../../../library/room/a<\/code>.<\/p>","keywords":"relative target symlink index"},{"title":"Rekursja po katalogach","group":"Katalogi","content":"<p>Wejdź tylko wtedy, gdy <code>lstat<\/code> daje <code>S_ISDIR<\/code>. Gdy śledzisz linki do katalogów, łatwo o cykle. <code>.<\/code> i <code>..<\/code> muszą być pominięte. Dla wpisu <code>readdir<\/code> <code>d_name<\/code> jest lokalne, więc musisz zbudować <code>parent/d_name<\/code>, a nie wywołać <code>lstat(d_name)<\/code> będąc w obcym katalogu.<\/p><p><b>Ważne:<\/b> <code>readdir<\/code> może zmienić errno wyłącznie na błędzie; własne operacje w środku pętli mogą też zmieniać errno, więc zeruj je bezpośrednio przed <b>następnym<\/b> readdir, nie raz przed całym skanowaniem. Bardzo głęboka rekursja może przepełnić stos i limit otwartych katalogów.<\/p>","keywords":"walk scandir recursive"},{"title":"Symlink vs hardlink vs kopia","group":"Dowiązania","content":"<table><tr><th>Własność<\/th><th>Symlink<\/th><th>Hardlink<\/th><th>Kopia<\/th><\/tr><tr><td>Nowy inode<\/td><td>Tak, oddzielny<\/td><td>Nie, ten sam<\/td><td>Tak<\/td><\/tr><tr><td>Wskazuje przez<\/td><td>Tekst ścieżki<\/td><td>Ten sam inode<\/td><td>Własne dane<\/td><\/tr><tr><td>Może zwisać (dangling)<\/td><td>Tak<\/td><td>Nie w tym sensie<\/td><td>Nie<\/td><\/tr><tr><td>Może przekroczyć filesystem<\/td><td>Tak<\/td><td>Nie<\/td><td>Tak<\/td><\/tr><tr><td>Oryginał usunięty<\/td><td>Może się zepsuć<\/td><td>Dalej działa<\/td><td>Dalej działa<\/td><\/tr><tr><td>Uprawnienia zawartości<\/td><td>Cel, sam symlink zwykle nieistotny<\/td><td>Wspólne dla tego samego inode<\/td><td>Własne<\/td><\/tr><\/table><p><code>stat(link)<\/code> bada cel, <code>lstat(link)<\/code> sam link. <code>readlink<\/code> czyta dosłowny zapisany target, nie rozwiązuje go do ścieżki absolutnej.<\/p>","keywords":"hardlink copy symlink inode"},{"title":"Rozwiązanie symlinków: mapa dla zadania 4","group":"Dowiązania","content":"<div class=\"pathdiagram\"><div class=\"tree\">.\n├── library/\n│   └── room/\n│       └── scroll.txt\n└── index/\n    ├── by-visible-title/\n    │   └── scroll.txt  → ../../library/room/scroll.txt\n    ├── by-title/\n    │   └── Actual title → ../../library/room/scroll.txt\n    └── by-genre/\n        └── history/\n            └── Actual title → ../../../library/room/scroll.txt<\/div><\/div><p>W <code>symlink(target, linkpath)<\/code> pierwszy argument jest <b>zawartością linku<\/b>, drugi miejscem jego utworzenia. <code>symlink(\"library/x\", \"index/by-title/x\")<\/code> jest błędnym celem względnym dla takiego układu.<\/p>","keywords":"../../ ../../../ path"},{"title":"Tryby fopen","group":"Pliki i strumienie","content":"<table><tr><th>Tryb<\/th><th>Istnienie<\/th><th>Odczyt<\/th><th>Zapis<\/th><th>Efekt<\/th><\/tr><tr><td><code>r<\/code><\/td><td>Wymagane<\/td><td>Tak<\/td><td>Nie<\/td><td>Od początku<\/td><\/tr><tr><td><code>r+<\/code><\/td><td>Wymagane<\/td><td>Tak<\/td><td>Tak<\/td><td>Bez obcięcia<\/td><\/tr><tr><td><code>w<\/code><\/td><td>Tworzy, jeśli brak<\/td><td>Nie<\/td><td>Tak<\/td><td>Truncate do 0<\/td><\/tr><tr><td><code>w+<\/code><\/td><td>Tworzy, jeśli brak<\/td><td>Tak<\/td><td>Tak<\/td><td>Truncate do 0<\/td><\/tr><tr><td><code>a<\/code><\/td><td>Tworzy, jeśli brak<\/td><td>Nie<\/td><td>Tak<\/td><td>Każdy zapis na końcu<\/td><\/tr><tr><td><code>a+<\/code><\/td><td>Tworzy, jeśli brak<\/td><td>Tak<\/td><td>Tak<\/td><td>Zapisy na końcu<\/td><\/tr><\/table><p><code>b<\/code> (rb,wb) na Unixie nie zmienia semantyki bajtów, może poprawić przenośność na inne systemy. Gdy strumień jest <code>+<\/code>, między odczytem a zapisem potrzebna jest synchronizacja według zasad manuala.<\/p>","keywords":"modes fopen append seek"},{"title":"Mode / prawa / umask","group":"Uprawnienia","content":"<p><code>r=4<\/code>, <code>w=2<\/code>, <code>x=1<\/code> dla właściciela, grupy i innych. <code>0755 = rwxr-xr-x<\/code>, <code>0644 = rw-r--r--<\/code>, <code>0444 = r--r--r--<\/code>, <code>0700 = rwx------<\/code>. <code>0777<\/code> to pełne 9 bitów praw, początkowe zero oznacza zapis ósemkowy w C.<\/p><p>Tworzenie przez fopen: <code>0666 &amp; ~umask<\/code>. Tworzenie katalogu przez mkdir: <code>mode &amp; ~umask<\/code>. <code>chmod(path, mode)<\/code> ustawia mode już bez maski tworzenia. <b>W katalogu<\/b> r pozwala listować nazwy, x wchodzić/wyszukiwać, a w razem z x zmieniać wpisy. W pliku x = uruchomienie.<\/p><p>Inne bity: <code>04000<\/code> setuid, <code>02000<\/code> setgid, <code>01000<\/code> sticky. W katalogu publicznym sticky bit ogranicza usuwanie cudzych wpisów.<\/p>","keywords":"rw-r--r-- chmod octal 755"},{"title":"64 bajty ≠ 64 znaki UTF-8","group":"Parsowanie","content":"<p>W zadaniu 4 wartości <code>title<\/code> i <code>genre<\/code> mają być ucinane do <b>64 bajtów<\/b>. <code>strlen<\/code> mierzy bajty, nie znaki. Greckie i polskie litery zajmują zwykle 2 lub więcej bajtów. Naiwne <code>strndup(s,64)<\/code> spełnia limit bajtów, ale może rozciąć sekwencję UTF-8 i dać niepoprawną nazwę z punktu widzenia prezentacji. Jeśli wymagane poprawne UTF-8, cofnij granicę do początku niedokończonej sekwencji; wtedy używasz najwyżej 64 bajtów. Przy porównywaniu rekordów bazy trzymaj dokładnie ten sam sposób ucinania.<\/p><p>Pole binarne tytułu ma <b>64 bajty bez gwarancji NUL<\/b>. Wczytuj je do <code>char title[65]<\/code> i ustaw <code>title[64]=0<\/code>. Nie używaj strlen bez tego zabezpieczenia.<\/p>","keywords":"utf8 truncate title genre"},{"title":"Format binarny zadania 4","group":"Binaria","content":"<p>Każdy wpis zajmuje dokładnie <b>68 bajtów<\/b>: pierwsze <b>4<\/b> to rozmiar jako <code>unsigned int<\/code> (przy założeniu laboratorium: 4 bajty), następne <b>64<\/b> to tytuł uzupełniony zerami. Nie jest to normalny plik tekstowy ani lista obiektów w pamięci. Nie wczytuj go przez <code>fgets<\/code> czy <code>%s<\/code>. Użyj <code>open<\/code>, <code>readv<\/code>, <code>close<\/code>.<\/p><p>Przy <code>readv(fd, [{&amp;size,4},{title,64}],2)<\/code> sprawdź liczbę rzeczywiście odczytanych bajtów: 68 = pełny rekord, 0 na granicy rekordu = EOF, 1..67 wymaga kontynuacji, a -1 to błąd. Rozmiar jest interpretowany zgodnie z formatem hosta, który utworzył bazę; bez jawnego ustalenia kolejności bajtów nie przenośny pomiędzy endianami.<\/p>","keywords":"database title 68 byte readv"},{"title":"Sparse files, NUL i rozmiar","group":"Pliki i strumienie","content":"<p>Znak <code>'0'<\/code> ma w ASCII wartość 0x30, natomiast <code>'\\0'<\/code> ma wartość 0x00. Gdy przesuniesz pozycję za EOF i zapiszesz bajt, brakujące obszary logicznie zawierają zera i mogą nie zajmować bloków dyskowych (sparse). <code>fseek<\/code> sam w sobie nie powiększa pliku. Aby wymusić dokładny rozmiar, użyj <code>ftruncate(fileno(f), size)<\/code> po opróżnieniu bufora stdio lub zapisz zero na pozycji <code>size-1<\/code> (dla size &gt; 0).<\/p><p>Przykład z tutoriala losujący offsety nie gwarantuje, że ostatni bajt zostanie zapisany i nie gwarantuje 10% różnych pozycji (kolizje). <code>RAND_MAX<\/code> zależy od platformy; jeśli rozmiar jest większy od możliwych wyników, <code>rand()%size<\/code> nie obejmie całego pliku. Aby uzyskać dokładnie 10% niezerowych bajtów, najlepiej przygotować bajtowy bufor, wstawić odpowiednią liczbę liter w różne pozycje i zapisać całość.<\/p>","keywords":"sparse null zero rand size"},{"title":"Buffering stdout/stderr","group":"Pliki i strumienie","content":"<p><code>stdout<\/code> do terminala jest zwykle buforowany liniowo, do pliku najczęściej pełnym buforem. <code>stderr<\/code> zwykle jest niebuforowany. <code>printf(\"x\")<\/code> może nie pojawić się od razu. <code>printf(\"x\\n\")<\/code> może opróżnić bufor liniowy, nie pełny. <code>fflush(stdout)<\/code> wymusza przekazanie z stdio do systemu, <b>nie<\/b> trwałość na nośniku.<\/p><p>Poprawne przekierowania shellowe to <code>&gt;out.txt<\/code>, <code>2&gt;err.txt<\/code>, <code>&gt;out.txt 2&gt;&amp;1<\/code>. Do debugowania <code>fprintf(stderr,...)<\/code>, do wyniku programu <code>stdout<\/code>.<\/p>","keywords":"stdout stderr printf flush"},{"title":"Błędy kompilacji / brak prototypu","group":"Błędy","content":"<table><tr><th>Komunikat<\/th><th>Najczęstszy powód<\/th><th>Rozwiązanie<\/th><\/tr><tr><td>implicit declaration of function<\/td><td>Brakuje nagłówka lub feature test macro<\/td><td>Dodaj nagłówek i <code>-D_POSIX_C_SOURCE=200809L<\/code><\/td><\/tr><tr><td>unknown type name ssize_t<\/td><td>Brak <code>&lt;sys/types.h&gt;<\/code> / <code>&lt;unistd.h&gt;<\/code><\/td><td>Dodaj odpowiedni nagłówek<\/td><\/tr><tr><td>unknown type name mode_t<\/td><td>Brak <code>&lt;sys/types.h&gt;<\/code> lub <code>&lt;sys/stat.h&gt;<\/code><\/td><td>Dodaj nagłówek<\/td><\/tr><tr><td>undefined reference<\/td><td>Brak implementacji w linkowaniu<\/td><td>Sprawdź deklarację/definicję, linkowane pliki i biblioteki<\/td><\/tr><tr><td>comparison of unsigned expression &lt; 0<\/td><td>size_t nigdy nieujemne<\/td><td>Waliduj przed konwersją<\/td><\/tr><tr><td>format specifies...<\/td><td>Niezgodny format printf<\/td><td>%zu size_t, %zd ssize_t, %jd z intmax_t<\/td><\/tr><tr><td>segmentation fault<\/td><td>NULL, pamięć po free, bufor overflow<\/td><td>ASan/UBSan i gdb, nie ignoruj ostrzeżeń<\/td><\/tr><\/table>","keywords":"compile gcc warning"},{"title":"Zasady czyszczenia zasobów","group":"Błędy","content":"<p><b>Kto alokuje, ten zwalnia.<\/b> <code>opendir → closedir<\/code>; <code>fopen → fclose<\/code>; <code>open → close<\/code>; <code>malloc/calloc/realloc/strdup/getline/realpath(NULL) → free<\/code>. <code>readdir<\/code> oddaje wskaźnik pożyczony, którego <b>nie<\/b> wolno zwalniać. <code>getenv<\/code> też nie free(). <code>fclose<\/code> może zwrócić błąd na samym końcu zapisu.<\/p><p>W kodzie z wieloma lokalnymi zasobami pomocny bywa pojedynczy blok <code>cleanup:<\/code> i <code>goto cleanup<\/code>. W rekursji zwalniaj ścieżkę przy każdej iteracji. Jeżeli program kończy się fatalnym błędem, OS odzyskuje fd i pamięć, ale warto przewidzieć częściowo zapisane pliki i niedokończone indeksy.<\/p>","keywords":"free cleanup resources"},{"title":"Weryfikacja i testy ręczne","group":"Testowanie","content":"<p>Zawsze testuj: katalog pusty (w tym <code>.<\/code>/<code>..<\/code>), brak uprawnień, nieistniejący, symlink dobry, wiszący i cykliczny, folder zawierający spacje, UTF-8, bardzo długą nazwę, te same tytuły w różnych miejscach, brakujące pola metadata, pustą wartość, plik 0 bajtów i ucięty rekord binarny.<\/p><p>Dla zadania 4 uruchom <code>find index -type l -ls<\/code> i <code>find -L index -type l -print<\/code> (wiszące linki mogą zostać wykryte przez GNU find), a następnie porównaj <code>stat index/by-title/nazwa<\/code> z <code>stat -L<\/code> i uruchom kod pod sanitizizerem.<\/p>","keywords":"tests testcases"},{"title":"Różnice POSIX vs Linux/glibc","group":"Manual","content":"<p>Podstawowe deklaracje POSIX to m.in. <code>d_ino<\/code> i <code>d_name<\/code> w <code>struct dirent<\/code>. <code>d_type<\/code> nie jest obiecane w standardzie POSIX i w Linuksie może mieć <code>DT_UNKNOWN<\/code>, więc do typu używaj <code>lstat<\/code>. <code>asprintf<\/code>, <code>getline<\/code> w starszym C, <code>openat2<\/code>, <code>renameat2<\/code> mają odmienną dostępność. <code>readv<\/code> jest w POSIX.<\/p><p>Pierwszeństwo ma instrukcja laboratorium i specyfikacja zadania, następnie aktualny man na maszynie docelowej. Kompendium nie zastępuje semantycznej prawdy o dowolnej implementacji systemu.<\/p>","keywords":"portable GNU Linux"},{"title":"Decyzje błędów: abort vs continue","group":"Błędy","content":"<p><b>Błąd CLI:<\/b> usage i kod niezerowy. <b>Nieistniejący katalog z listy<\/b> w zad.1: raport na stderr i kontynuuj pozostałe. <b>Zad.3 błędne środowisko:<\/b> zakończ, nie wykonuj dalszych. <b>Zad.4 EEXIST w index lub nazwa tytułu:<\/b> zakończ według specyfikacji. <b>Nieobecny klucz title:<\/b> pomiń w by-title/by-genre, ale widoczna nazwa nadal powinna mieć dowiązanie. <b>Nieistniejąca pozycja bazy:<\/b> diagnostyka „missing”, nie awaria odczytu.<\/p>","keywords":"failure policies task stages"},{"title":"Kłopotliwe założenia w przykładach","group":"Pułapki","content":"<p>Nie ufaj bezrefleksyjnie nawet kodowi demonstracyjnemu. W tutorialu: licznik katalogów obejmuje <code>.<\/code> i <code>..<\/code>, jeśli ich nie odfiltrujesz; <code>rand()%size<\/code> nie gwarantuje rozmiaru ani 10% różnych pozycji; założenie o „2-bajtowym RAND_MAX” nie jest przenośną własnością <code>rand<\/code>; <code>umask(~perms &amp; 0777)<\/code> usuwa bity, ale <code>fopen<\/code> i tak nie nada x; <code>chmod<\/code> nie wymaga prawa zapisu do pliku, tylko odpowiedniej własności/uprawnienia; <code>fseek + ftell<\/code> nie jest dobrym uniwersalnym sposobem rozmiaru na każdym strumieniu; shellowe stderr to <code>2&gt;plik<\/code>, nie <code>&gt;2<\/code>.<\/p><p>Również <code>fopen(...,\"w\")<\/code> nie tworzy pliku „na nowo” pod kątem praw, jeśli już istnieje: obcina istniejący inode.<\/p>","keywords":"tutorial corrections rand chmod shell"},{"title":"Kolejność realizacji zadania 4","group":"Zadanie 4","content":"<ol><li><b>Parser:<\/b> otwórz metadane, getline, strchr(':'); przechowaj title, genre, author, obsłuż brak pól. Wydziel do osobnej funkcji.<\/li><li><b>Rekursja:<\/b> opendir/readdir/lstat; pomijaj . i .. oraz symlinki, indeksuj S_ISREG. Każdy indeks twórz w index, które musi być nieistniejące.<\/li><li><b>Indeksy:<\/b> by-visible-title nazwa fizycznego pliku; by-title nazwa pola title; by-genre/genre/title. Przycinaj do 64 bajtów i wykrywaj EEXIST. Uważaj na separator <code>/<\/code> w tytułach/gatunkach.<\/li><li><b>Baza:<\/b> open+readv; 4+64 bajty; na wejściu tytuł zakończ NUL w buforze 65. stat indeksu <code>index/by-title/...<\/code> (podąża za linkiem), porównaj rozmiar z bazą. Wypisz brakujące i mismatch.<\/li><\/ol><p>Przy przechodzeniu z etapu 2 do 3 warto trzymać trzy niezależne funkcje do tworzenia różnych linków.<\/p>","keywords":"alexandria example4 full"},{"title":"Mapowanie zadań 1–4","group":"Zadania","content":"<table><tr><th>Zadanie<\/th><th>Składniki<\/th><th>Największa pułapka<\/th><\/tr><tr><td>1: listing katalogów<\/td><td>getopt, wielokrotne -p, -o, readdir, lstat, fprintf<\/td><td>Przy nieudanym katalogu kontynuuj, przy powtórzonym -o użyj usage<\/td><\/tr><tr><td>2: skan katalogów<\/td><td>getopt, -d głębokość, -e rozszerzenie, getenv, rekursja<\/td><td>Interpretuj depth 1 jako TYLKO katalog startowy<\/td><\/tr><tr><td>3: manager pakietów<\/td><td>mkdir, plik requirements, parser, duplikaty, usuwanie, chmod<\/td><td>Bezpieczna zamiana treści requirements i pliki 0444<\/td><\/tr><tr><td>4: Aleksandria<\/td><td>getline, symlink, UTF-8, rekurencja, readv<\/td><td>../../ vs ../../../ oraz 68-bajtowy rekord<\/td><\/tr><\/table>","keywords":"exercise 1 2 3 4"}],"commands":[{"command":"man 3p readdir","usage":"Manual POSIX dla funkcji readdir","notes":"Jeśli brak sekcji 3p, sprawdź man 3 readdir lub doinstaluj manpages-posix-dev."},{"command":"man -k symlink / apropos symlink","usage":"Wyszukaj manual po opisie/temacie","notes":"man -f nazwa / whatis nazwa: wypisz zwięzłe strony pasujące do nazwy."},{"command":"man 7 inode","usage":"Opis typów plików, uprawnień, inode","notes":"Uzupełnienie do struct stat i S_IS*."},{"command":"gcc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Wpedantic -Wconversion -g main.c -o prog","usage":"Kompilacja z POSIX i ostrzeżeniami","notes":"Wconversion może generować celowe ostrzeżenia przy konwersjach; nie ignoruj bezmyślnie."},{"command":"gcc -std=c11 -D_POSIX_C_SOURCE=200809L -g -fsanitize=address,undefined main.c -o prog","usage":"Debug pamięci i UB (Linux)","notes":"Nie każda platforma ma dostępne sanitizery; program może działać wolniej."},{"command":"ls -la / ls -li / ls -l","usage":"Uprawnienia, inode, widok symlinków","notes":"-i: inode, -d: sam katalog, -a: wpisy . i .."},{"command":"stat FILE / stat -L FILE","usage":"Metadane linku vs celu","notes":"W GNU stat bez -L bada link, z -L podąża za nim."},{"command":"readlink LINK / readlink -f LINK","usage":"Dosłowny cel / kanoniczna ścieżka","notes":"readlink -f jest narzędziem GNU, nie C readlink."},{"command":"ln -s ../a/book b/book_link","usage":"Tworzenie symlink o względnym celu","notes":"Cel ../a/book liczony z katalogu b, NIE z CWD."},{"command":"find library -type f -print","usage":"Lista wszystkich zwykłych plików bez symlinków","notes":"find -L podąża za symlinkami, może zmienić wynik."},{"command":"find library -type l -ls","usage":"Wykryj dowiązania i problemy","notes":"-xtype l / ! -exec test ... to bardziej zaawansowane sprawdzanie broken symlink."},{"command":"namei -l PATH","usage":"Uprawnienia do każdego komponentu ścieżki","notes":"Bardzo przydatne przy EACCES, ENOTDIR, ENOENT."},{"command":"od -An -tx1 -v FILE / xxd -g 1 FILE","usage":"Podgląd bajtów binarnych","notes":"NUL to 00, ASCII 0 to 30; do bazy 68 bajtów."},{"command":"wc -c < FILE / stat -c %s FILE","usage":"Rozmiar w bajtach","notes":"Rozmiar logiczny nie musi równać się fizycznemu zużyciu."},{"command":"du -h FILE / du --apparent-size -h FILE","usage":"Zajęte bloki vs rozmiar logiczny","notes":"Dobre przy sparse file."},{"command":"umask / umask 022","usage":"Aktualna maska uprawnień powłoki","notes":"Odróżnij maskę procesu powłoki od umask() wewnątrz C."},{"command":"chmod 644 FILE / chmod 755 DIR","usage":"Nadanie uprawnień","notes":"Katalog wymaga x do przechodzenia."},{"command":"L1_OUTPUTFILE=result.txt ./prog -p library -o","usage":"Jednorazowe ustawienie zmiennej środowiskowej","notes":"Przykład do zadania 2."},{"command":"valgrind --leak-check=full ./prog","usage":"Wyszukiwanie wycieków, gdy Valgrind dostępny","notes":"Dodatkowo -fsanitize=address; Valgrind i ASan nie zawsze łączy się w jednym uruchomieniu."},{"command":"strace -e trace=file ./prog","usage":"Śledź systemowe operacje na plikach (Linux)","notes":"Widzisz, skąd ENOENT, EEXIST i co naprawdę wywołano."},{"command":"mkdir -p a b; touch a/book; ln -s ../a/book b/x","usage":"Mikrotest symlinków","notes":"ls -l b/x, stat b/x, stat -L b/x, readlink b/x."},{"command":"2>errors.log / >output.log / 2>&1","usage":"Przekierowanie stdout/stderr w shellu","notes":"Uwaga: poprawna składnia to 2>plik, nie >2."},{"command":"git diff / git status / git add / git commit","usage":"Kontrola postępu w laboratorium","notes":"Po każdym etapie kompilacja + szybki test + commit, jeśli wymagany."}]};
const $=(s,root=document)=>root.querySelector(s);
const $$=(s,root=document)=>Array.from(root.querySelectorAll(s));
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=(s)=>s.replace(/[łŁ]/g,c=>c==='ł'?'l':'L').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,90);
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const plain=s=>String(s??'').replace(/<[^>]*>/g,' ').replace(/&(?:[a-z]+|#\d+);/g,' ').replace(/\s+/g,' ');
let items=[],current='home',saved=[],recent=[],activeFilter='all',navSaved=false,lastSearch='',selectedResult=0;
const types={api:'Funkcje',recipe:'Przykłady',concept:'Wiedza',error:'Błędy',command:'Terminal'};
for(const d of DATA.entries) items.push({...d,id:'api-'+slug(d.name),type:'api',title:d.name,sub:d.signature,blob:[d.name,d.group,d.signature,d.header,d.params,d.ret,d.errs,d.notes,d.example,d.man,d.keywords].join(' ')});
for(const d of DATA.recipes) items.push({...d,id:'recipe-'+slug(d.name),type:'recipe',title:d.name,sub:d.summary,blob:[d.name,d.group,d.summary,d.code,d.explain,d.gotchas,d.keywords].join(' ')});
for(const d of DATA.concepts) items.push({...d,id:'concept-'+slug(d.title),type:'concept',sub:plain(d.content),blob:[d.title,d.group,plain(d.content),d.keywords].join(' ')});
for(const d of DATA.errors) items.push({...d,id:'error-'+slug(d.symbol),type:'error',title:d.symbol,group:'errno',sub:d.meaning,blob:Object.values(d).join(' ')});
for(const d of DATA.commands) items.push({...d,id:'command-'+slug(d.command),type:'command',title:d.command,group:'Komendy',sub:d.usage,blob:Object.values(d).join(' ')});
const lookup=new Map(items.map(x=>[x.id,x]));
for(const x of items)x.normalized=norm(x.blob);
try{ saved=JSON.parse(localStorage.getItem('sop1-saved')||'[]').filter(x=>lookup.has(x));recent=JSON.parse(localStorage.getItem('sop1-recent')||'[]').filter(x=>lookup.has(x));if(localStorage.getItem('sop1-theme')==='light')document.documentElement.classList.add('light')}catch{}
function store(k,v){try{localStorage.setItem('sop1-'+k,JSON.stringify(v))}catch{}}
function codeBlock(code,label='C / POSIX') {const id='code-'+Math.random().toString(36).slice(2);const inner=`<div class="codebox"><div class="codehead"><span>${escapeHtml(label)}</span><button class="copy" data-copy-id="${id}">Kopiuj kod ↗</button></div><pre id="${id}"><code>${escapeHtml(code)}</code></pre></div>`;return code.length>4500?`<details class="collapse"><summary>Rozwiń pełny kod (${code.split('\n').length} linii)</summary>${inner}</details>`:inner}
function meta(key,html){return `<div class="meta"><strong>${escapeHtml(key)}</strong><div>${html}</div></div>`}
function navTo(id){if(id!=='home'&&!lookup.has(id))return;if($('#search').value.trim())lastSearch=$('#search').value.trim();current=id;$('#search').value='';activeFilter='all';window.location.hash=id==='home'?'':encodeURIComponent(id);render();$('#sidebar').classList.remove('open');if(id!=='home'){recent=[id,...recent.filter(a=>a!==id)].slice(0,15);store('recent',recent)}window.scrollTo({top:0,behavior:'instant'})}
function renderSide(){let target=navSaved?items.filter(x=>saved.includes(x.id)):items.filter(x=>['api','concept','recipe'].includes(x.type));const sections={};if(!navSaved){target.sort((a,b)=>['Wiedza','Funkcje','Przykłady'].indexOf(types[a.type])-['Wiedza','Funkcje','Przykłady'].indexOf(types[b.type]));}
for(const d of target){const group=navSaved?'Zapisane':`${types[d.type]} · ${d.group}`;(sections[group]??=[]).push(d)}
let html=`<button class="navitem ${current==='home'?'active':''}" data-go="home"><span class="circle">⌂</span> Centrum dowodzenia</button>`;
for(const [group,vals] of Object.entries(sections)){html+=`<div class="navgroup">${escapeHtml(group)}</div>`;for(const x of vals){html+=`<button class="navitem ${current===x.id?'active':''}" data-go="${x.id}"><span class="circle">${x.type==='api'?'ƒ':x.type==='recipe'?'&lt;/&gt;':'§'}</span><span>${escapeHtml(x.title)}</span></button>`}}
if(!target.length)html+='<div class="hint" style="padding:15px">Brak zapisanych haseł.</div>';
$('#sidenav').innerHTML=html;$('#sideCount').textContent=items.length;$('#sideAll').classList.toggle('active',!navSaved);$('#sideSaved').classList.toggle('active',navSaved)}
function topDoc(x){return `<div class="crumb">${escapeHtml(types[x.type])} / ${escapeHtml(x.group)}</div><h1>${escapeHtml(x.title)}</h1><p class="lead">${escapeHtml(x.sub||'')}</p><div class="doc-actions"><button class="btn" id="saveBtn">${saved.includes(x.id)?'★ Usuń z zapisanych':'☆ Zapisz na później'}</button><button class="btn" id="linkBtn">Kopiuj odnośnik</button><button class="btn" id="backBtn">← Wróć do wyników</button></div>`}
function renderDoc(x){let html=topDoc(x);if(x.type==='api'){
html+=`<article class="detail"><h2>Sygnatura i nagłówek</h2><div class="sigbox">${escapeHtml(x.signature)}</div>${meta('Nagłówek',`<code>${escapeHtml(x.header)}</code>`)}${meta('Argumenty',escapeHtml(x.params))}${meta('Zwraca',escapeHtml(x.ret))}${meta('Błędy',escapeHtml(x.errs))}${meta('W praktyce',escapeHtml(x.notes))}<h3>Minimalny przykład</h3>${codeBlock(x.example)}<h3>Co otworzyć w manualu</h3><div class="manuals">${x.man.split('/').map(s=>`<span>${escapeHtml(s.trim())}</span>`).join('')}</div></article>`;
}else if(x.type==='recipe'){html+=`<article class="detail"><p>${escapeHtml(x.summary)}</p>${codeBlock(x.code,x.name.toLowerCase().includes('nagłówk')?'Headers':'C / POSIX · kopiuj do edytora')}<div class="text-section">${x.explain?`<h3>Jak użyć / dlaczego działa</h3>${x.explain}`:''}${x.gotchas?`<div class="callout"><b>Pułapki i ograniczenia</b><div>${x.gotchas}</div></div>`:''}</div></article>`}
else if(x.type==='concept'){html+=`<article class="detail text-section">${x.content}</article>`}
else if(x.type==='error'){html+=`<article class="detail"><h2>${escapeHtml(x.meaning)}</h2>${meta('Typowe źródła',escapeHtml(x.likely))}${meta('Naprawa',escapeHtml(x.fix))}<div class="callout"><b>Pamiętaj</b> Sam kod errno nie opisuje całego problemu. Sprawdź, która funkcja zwróciła błąd i jakie dostała argumenty.</div></article>`}
else if(x.type==='command'){html+=`<article class="detail"><div class="sigbox">${escapeHtml(x.command)}</div><h3>Zastosowanie</h3><p>${escapeHtml(x.usage)}</p><h3>Wskazówki</h3><p>${escapeHtml(x.notes)}</p></article>`}
html+=`<div class="detail"><h3>Powiązane hasła</h3><div class="mini-nav">${related(x).map(t=>`<button data-go="${t.id}">${escapeHtml(t.title)}</button>`).join('')}</div></div>`;return html}
function related(x){const q=norm(x.title).split(/[^a-z0-9]+/).filter(w=>w.length>3);return items.filter(a=>a.id!==x.id&& (a.group===x.group || q.some(w=>a.normalized.includes(w)))).slice(0,7)}
function rank(x,tokens){const title=norm(x.title),group=norm(x.group);let score=0;for(const t of tokens){if(!x.normalized.includes(t))return -1;if(title===t)score+=150;else if(title.startsWith(t))score+=90;else if(title.includes(t))score+=60;else if(group.includes(t))score+=20;else score+=4}if(x.type==='api')score+=5;if(x.priority===1)score+=5;return score}
function renderResults(q,filter=activeFilter){const tokens=norm(q).split(/\s+/).filter(Boolean);let found=items.filter(x=>filter==='all'||x.type===filter).map(x=>({x,score:rank(x,tokens)})).filter(v=>v.score>=0);found.sort((a,b)=>b.score-a.score||a.x.title.localeCompare(b.x.title,'pl'));const title=q?`Wyniki dla „${escapeHtml(q)}”`:'Przegląd biblioteki';let html=`<div class="eyebrow">Indeks wiedzy</div><h1>${title}</h1><p class="lead">Przeszukujesz treść funkcji, sygnatury, argumenty, zadania, kody błędów i gotowe przykłady. Używaj kilku słów naraz, np. <code>symlink względny</code>, <code>readv 68</code>, <code>getopt -o</code>.</p><div class="filters">${Object.entries({all:'Wszystko',...types}).map(([key,value])=>`<button class="chip ${filter===key?'active':''}" data-filter="${key}">${escapeHtml(value)}</button>`).join('')}</div><div class="resultcount">${found.length} z ${items.length} haseł · wyszukiwanie także wewnątrz kodu i opisów</div>`;
for(const {x} of found.slice(0,q?150:100)){html+=`<button class="result" data-go="${x.id}"><span class="groupbadge">${escapeHtml(types[x.type])}</span><span class="rtitle">${escapeHtml(x.title)}</span><div class="rdesc">${escapeHtml((x.sub||x.blob||'').slice(0,190))}</div></button>`}
if(!found.length)html+='<div class="empty">Brak dopasowań. Spróbuj krótszej frazy, nazwy funkcji, errno lub polskiego opisu zadania.</div>';
if(found.length>(q?150:100))html+=`<p class="hint">Wyświetlono pierwsze wyniki. Zawęź wyszukiwanie.</p>`;
return html}
function tile(id,number,headline,sub){return `<div class="tile" role="button" tabindex="0" data-go="${id}"><div class="k">${number}</div><h3>${headline}</h3><p>${sub}</p></div>`}

<h2>Ostatnio otwierane</h2><div class="mini-nav">${(recent.length?recent.slice(0,7):['api-readdir','api-lstat','api-symlink','api-readv-writev','api-getline-getdelim']).filter(id=>lookup.has(id)).map(id=>`<button data-go="${id}">${escapeHtml(lookup.get(id).title)}</button>`).join('')}</div>
<div class="detail"><h3>O źródłach i ograniczeniach</h3><p>Opracowano na podstawie aktualnej strony L1 i czterech przykładowych zadań, uzupełniając dokumentacją POSIX i Linux man-pages. Program referencyjny do zadania 4 został skompilowany i sprawdzony na lokalnym drzewie testowym. Żadne skończone kompendium nie może zagwarantować odpowiedzi na <em>dosłownie każdy</em> możliwy błąd każdej implementacji. Najwyższą rangę zachowuje <code>man</code> na maszynie laboratoryjnej.</p></div>${footer()}`}
function footer(){return `<div class="footer"><b>Źródła i manuale</b><div><a href="https://sop.mini.pw.edu.pl/pl/sop1/lab/l1/" target="_blank" rel="noopener">Tutorial SOP1 L1</a> · <a href="https://sop.mini.pw.edu.pl/pl/sop1/lab/l1/example1/" target="_blank" rel="noopener">Zad. 1</a> · <a href="https://sop.mini.pw.edu.pl/pl/sop1/lab/l1/example2/" target="_blank" rel="noopener">Zad. 2</a> · <a href="https://sop.mini.pw.edu.pl/pl/sop1/lab/l1/example3/" target="_blank" rel="noopener">Zad. 3</a> · <a href="https://sop.mini.pw.edu.pl/pl/sop1/lab/l1/example4/" target="_blank" rel="noopener">Zad. 4</a> · <a href="https://man7.org/linux/man-pages/" target="_blank" rel="noopener">Linux man-pages</a> · <a href="https://pubs.opengroup.org/onlinepubs/9799919799/" target="_blank" rel="noopener">POSIX</a>.</div><div>Plik autonomiczny: HTML, CSS i JavaScript osadzone lokalnie. Brak CDN i połączeń wymaganych do działania. Materiał pomocniczy, nie oficjalna publikacja PW.</div></div>`}
function render(){renderSide();$('#content').innerHTML=$('#search').value.trim()?renderResults($('#search').value):current==='home'?renderHome():lookup.has(current)?renderDoc(lookup.get(current)):renderHome();if(current==='home'&&!$('#search').value.trim())initTools()}
function runSearch(){current='search';activeFilter='all';render();}
function copyValue(s,button){const done=()=>{if(button){const old=button.textContent;button.textContent='Skopiowano ✓';setTimeout(()=>button.textContent=old,1300)}};if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(s).then(done).catch(()=>copyFallback(s,done))}else copyFallback(s,done)}
function copyFallback(s,done){const t=document.createElement('textarea');t.value=s;t.style.position='fixed';t.style.left='-9999px';document.body.appendChild(t);t.select();try{document.execCommand('copy');done()}catch{window.prompt('Skopiuj ręcznie:',s)}t.remove()}
function initTools(){const p=$('#permGrid'),maskInput=$('#umaskInput'),out=$('#permResult');const names=['Owner r','Owner w','Owner x','Group r','Group w','Group x','Other r','Other w','Other x'];p.innerHTML=names.map((n,i)=>`<label><input type="checkbox" data-bit="${8-i}" ${[0,1,2,3,5,6,8].includes(i)?'checked':''}>${n}</label>`).join('');function upd(){let mode=0;$$('input[data-bit]',p).forEach(c=>{if(c.checked)mode|=1<<Number(c.dataset.bit)});let mv=maskInput.value.trim();if(!/^[0-7]{1,4}$/.test(mv)){out.textContent='Niepoprawny zapis oktalny umask';return}const u=parseInt(mv,8),fmt=n=>'0'+n.toString(8).padStart(3,'0');const bits=v=>[6,3,0].map(k=>((v>>k)&4?'r':'-')+((v>>k)&2?'w':'-')+((v>>k)&1?'x':'-')).join('');out.textContent=`mode: ${fmt(mode)} = ${bits(mode)}\numask: ${fmt(u)}\nmkdir(mode): ${fmt(mode&~u)}\nfopen nowy plik: ${fmt(0o666&~u)}\nchmod(mode): ${fmt(mode)} (bez umask)`}p.addEventListener('change',upd);maskInput.addEventListener('input',upd);upd();const a=$('#srcPath'),b=$('#linkPath'),res=$('#linkResult');function segments(v){const abs=v.startsWith('/'),x=[];for(const seg of v.split('/')){if(!seg||seg==='.')continue;if(seg==='..'){if(x.length&&x[x.length-1]!=='..')x.pop();else if(!abs)x.push('..')}else x.push(seg)}return {abs,x}}let command='';function calc(){const from=segments(a.value.trim()),to=segments(b.value.trim());if(from.abs!==to.abs){res.textContent='Błąd: obie ścieżki muszą być absolutne albo obie względne.';command='';return}const parent=to.x.slice(0,-1);let i=0;while(i<parent.length&&i<from.x.length&&parent[i]===from.x[i])i++;const relative=[...Array(parent.length-i).fill('..'),...from.x.slice(i)].join('/')||'.';command=`symlink("${relative}", "${b.value.trim()}");`;res.textContent=`Cel zapisany w symlinku:\n${relative}\n\nC:\n${command}`}a.addEventListener('input',calc);b.addEventListener('input',calc);calc();$('#linkCopy').onclick=()=>copyValue(command,$('#linkCopy'))}
document.addEventListener('click',e=>{const cp=e.target.closest('[data-copy-id]');if(cp){copyValue($('#'+cp.dataset.copyId)?.textContent||'',cp);return}const go=e.target.closest('[data-go]');if(go){navTo(go.dataset.go);return}const filt=e.target.closest('[data-filter]');if(filt){activeFilter=filt.dataset.filter;$('#content').innerHTML=renderResults($('#search').value,activeFilter);return}if(e.target.id==='saveBtn'){if(saved.includes(current))saved=saved.filter(a=>a!==current);else saved=[current,...saved];store('saved',saved);render();return}if(e.target.id==='linkBtn'){copyValue(location.href,$('#linkBtn'));return}if(e.target.id==='backBtn'){$('#search').value=lastSearch;current='search';activeFilter='all';$('#content').innerHTML=renderResults(lastSearch);$('#search').focus();return}});
$('#search').addEventListener('input',e=>{current='search';activeFilter='all';lastSearch=e.target.value;selectedResult=0;$('#content').innerHTML=renderResults(e.target.value);selectResult();});
function selectResult(){const rr=$$('#content .result');rr.forEach((r,i)=>r.classList.toggle('selected',i===selectedResult));}
$('#search').addEventListener('keydown',e=>{const rr=$$('#content .result');if(e.key==='ArrowDown'&&rr.length){e.preventDefault();selectedResult=Math.min(selectedResult+1,rr.length-1);selectResult();rr[selectedResult].scrollIntoView({block:'nearest'})}if(e.key==='ArrowUp'&&rr.length){e.preventDefault();selectedResult=Math.max(0,selectedResult-1);selectResult();rr[selectedResult].scrollIntoView({block:'nearest'})}if(e.key==='Enter'){const r=rr[selectedResult];if(r)navTo(r.dataset.go)}if(e.key==='Escape'){e.target.value='';navTo('home');e.target.blur()}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'||e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();$('#search').focus();$('#search').select()}if(e.key==='Escape'&&document.activeElement!==$('#search'))$('#sidebar').classList.remove('open');});
$('#themeBtn').onclick=()=>{document.documentElement.classList.toggle('light');try{localStorage.setItem('sop1-theme',document.documentElement.classList.contains('light')?'light':'dark')}catch{}};
$('#homeBtn').onclick=()=>navTo('home');
$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');
$('#sideAll').onclick=()=>{navSaved=false;renderSide()};
$('#sideSaved').onclick=()=>{navSaved=true;renderSide()};
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.tile')){e.preventDefault();navTo(e.target.dataset.go)}});
window.addEventListener('hashchange',()=>{const id=decodeURIComponent(location.hash.slice(1));if(!$('#search').value&&id!==current){current=lookup.has(id)?id:'home';render()}});
const fromHash=decodeURIComponent(location.hash.slice(1));current=lookup.has(fromHash)?fromHash:'home';render();
</script>
